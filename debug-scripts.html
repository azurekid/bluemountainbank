<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debug Script Loading - Blue Mountain Bank</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background: #f5f5f5; }
        .debug-panel { background: white; padding: 20px; border-radius: 8px; margin: 10px 0; }
        .error { color: red; background: #ffebee; padding: 10px; border-radius: 4px; }
        .success { color: green; background: #e8f5e9; padding: 10px; border-radius: 4px; }
        .warning { color: orange; background: #fff3e0; padding: 10px; border-radius: 4px; }
        pre { background: #f5f5f5; padding: 10px; border-radius: 4px; overflow-x: auto; }
    </style>
</head>
<body>
    <div class="debug-panel">
        <h1>🔍 Debug Script Loading</h1>
        <p>This page will help debug what scripts are being loaded and identify any IndexedDB references.</p>
        
        <div id="loadingStatus">
            <h3>Loading Status:</h3>
            <div id="statusMessages"></div>
        </div>
        
        <div id="scriptCheck">
            <h3>Script Availability Check:</h3>
            <div id="scriptResults"></div>
        </div>

        <div id="networkActivity">
            <h3>Manual Login Test:</h3>
            <button onclick="testLogin()" style="padding: 10px 20px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer;">Test Login Flow</button>
            <div id="loginResults"></div>
        </div>
    </div>

    <!-- Load scripts one by one to see which one might be causing issues -->
    <script>
        const statusDiv = document.getElementById('statusMessages');
        const scriptDiv = document.getElementById('scriptResults');
        
        function logStatus(message, type = 'info') {
            const div = document.createElement('div');
            div.className = type;
            div.textContent = `${new Date().toLocaleTimeString()}: ${message}`;
            statusDiv.appendChild(div);
            console.log(message);
        }

        function checkScript(name, className) {
            const available = typeof window[className] !== 'undefined';
            const div = document.createElement('div');
            div.className = available ? 'success' : 'error';
            div.textContent = `${name} (${className}): ${available ? 'Available' : 'Not Available'}`;
            scriptDiv.appendChild(div);
            return available;
        }

        // Override the error handling to catch any script loading errors
        window.addEventListener('error', function(e) {
            if (e.filename && e.filename.includes('indexeddb')) {
                logStatus(`❌ FOUND THE ISSUE: ${e.filename} - ${e.message}`, 'error');
            } else {
                logStatus(`Script error: ${e.filename} - ${e.message}`, 'warning');
            }
        });

        // Check what scripts are currently available before loading anything new
        logStatus('Starting script availability check...');
        
        setTimeout(() => {
            checkScript('LocalStorageManager', 'LocalStorageManager');
            checkScript('AzureStorageManager', 'AzureStorageManager');  
            checkScript('StorageFactory', 'StorageFactory');
            checkScript('IndexedDBManager (should not exist)', 'IndexedDBManager');
        }, 100);
    </script>

    <!-- Load scripts in order -->
    <script src="js/local-storage-manager.js" onload="logStatus('✅ local-storage-manager.js loaded')" onerror="logStatus('❌ local-storage-manager.js failed', 'error')"></script>
    <script src="js/azure-proxy.js" onload="logStatus('✅ azure-proxy.js loaded')" onerror="logStatus('❌ azure-proxy.js failed', 'error')"></script>
    <script src="js/azure-storage-manager.js" onload="logStatus('✅ azure-storage-manager.js loaded')" onerror="logStatus('❌ azure-storage-manager.js failed', 'error')"></script>
    <script src="js/storage-factory.js" onload="logStatus('✅ storage-factory.js loaded')" onerror="logStatus('❌ storage-factory.js failed', 'error')"></script>
    <script src="js/login.js" onload="logStatus('✅ login.js loaded')" onerror="logStatus('❌ login.js failed', 'error')"></script>

    <script>
        async function testLogin() {
            const resultsDiv = document.getElementById('loginResults');
            resultsDiv.innerHTML = '<p>Testing login flow...</p>';
            
            try {
                // Test creating storage factory
                logStatus('Creating StorageFactory...');
                const factory = new StorageFactory();
                
                logStatus(`Storage type detected: ${factory.getStorageType()}`);
                
                // Test initialization
                logStatus('Initializing storage...');
                await factory.initialize();
                
                logStatus('Getting storage manager...');
                const manager = await factory.getStorageManager();
                
                logStatus(`Storage manager type: ${manager.constructor.name}`);
                
                // Test authentication
                logStatus('Testing authentication...');
                const authResult = await manager.authenticateUser('alice.martinez', 'AliceSecure2025!');
                
                resultsDiv.innerHTML = `
                    <div class="${authResult.success ? 'success' : 'error'}">
                        Authentication ${authResult.success ? 'successful' : 'failed'}: ${authResult.message || 'No message'}
                    </div>
                `;
                
            } catch (error) {
                logStatus(`❌ Login test failed: ${error.message}`, 'error');
                resultsDiv.innerHTML = `<div class="error">Login test failed: ${error.message}</div>`;
            }
        }

        // Final availability check after all scripts loaded
        setTimeout(() => {
            logStatus('Final script check after loading...');
            checkScript('LocalStorageManager', 'LocalStorageManager');
            checkScript('AzureStorageManager', 'AzureStorageManager');  
            checkScript('StorageFactory', 'StorageFactory');
            checkScript('IndexedDBManager (should not exist)', 'IndexedDBManager');
            
            // Check if any global variables suggest IndexedDB usage
            if (typeof indexedDB !== 'undefined') {
                logStatus('IndexedDB API is available in browser', 'warning');
            }
            
            // Look for any IndexedDB references in the global scope
            for (let prop in window) {
                if (prop.toLowerCase().includes('indexeddb') || prop.toLowerCase().includes('idb')) {
                    logStatus(`Found potential IndexedDB reference in global scope: ${prop}`, 'warning');
                }
            }
        }, 2000);
    </script>
</body>
</html>
