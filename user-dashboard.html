<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Dashboard - Blue Mountain Bank</title>
    <!-- User authentication check script -->
    <script>
        // Immediately check if user is logged in
        (function() {
            const currentUser = sessionStorage.getItem('currentUser');
            const loginTime = sessionStorage.getItem('loginTime');
            
            if (!currentUser || !loginTime) {
                console.log('User not logged in - redirecting to login page');
                window.location.replace('login.html?redirect=' + encodeURIComponent(window.location.pathname));
                return;
            }
            
            // Optional: Check if session has expired (e.g., after 2 hours)
            const sessionAge = new Date() - new Date(loginTime);
            if (sessionAge > 7200000) { // 2 hours in milliseconds
                console.log('User session expired');
                sessionStorage.removeItem('currentUser');
                sessionStorage.removeItem('loginTime');
                sessionStorage.removeItem('userRole');
                window.location.replace('login.html?redirect=' + encodeURIComponent(window.location.pathname) + 
                    '&message=' + encodeURIComponent('Your session has expired. Please log in again.'));
                return;
            }
        })();
    </script>
    <!-- CDN Helper Script -->
    <script src="js/cdn-helper.js"></script>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/user-dashboard.css">
    <link rel="stylesheet" href="css/dark-mode.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="user-dashboard">
        <header class="user-header">
            <div class="header-content">
                <div class="logo-section">
                    <img src="img/blue-mountain-bank.png" alt="Blue Mountain Bank Logo" class="header-logo">
                    <h1>Blue Mountain Bank</h1>
                </div>
                <div class="user-info">
                    <div class="user-profile">
                        <div class="user-avatar" id="userAvatar">--</div>
                        <div class="user-details">
                            <div class="user-name" id="userName">Loading...</div>
                            <div class="user-account" id="userAccount">Account ****-****</div>
                        </div>
                    </div>
                    <button class="logout-btn" onclick="logout()">
                        <i class="fas fa-sign-out-alt"></i>
                        Logout
                    </button>
                </div>
            </div>
        </header>

        <main class="user-main">
            <div class="welcome-section">
                <div class="welcome-content">
                    <h2 id="welcomeMessage">Welcome back!</h2>
                    <p id="userInfo">Loading user information...</p>
                </div>
            </div>

            <div class="accounts-overview" id="accountsContainer">
                <!-- Accounts will be dynamically loaded here -->
            </div>

            <div class="dashboard-grid">
                <div class="dashboard-section">
                    <h3 class="section-title">
                        <i class="fas fa-exchange-alt"></i>
                        Recent Transactions
                    </h3>
                    <div class="transactions-list" id="transactionsList">
                        <!-- Transactions will be dynamically loaded here -->
                    </div>
                </div>

                <div class="dashboard-section">
                    <h3 class="section-title">
                        <i class="fas fa-bolt"></i>
                        Quick Actions
                    </h3>
                    <div class="quick-actions" id="quickActionsContainer">
                        <!-- Quick actions will be dynamically loaded here -->
                    </div>
                </div>

                <div class="dashboard-section">
                    <h3 class="section-title">
                        <i class="fas fa-user-shield"></i>
                        Personal Information
                        <a href="personal-info.html" style="font-size: 0.8em; color: #007bff; margin-left: 10px;">
                            <i class="fas fa-external-link-alt"></i> Manage
                        </a>
                    </h3>
                    <div class="personal-info-summary" id="personalInfoSummary">
                        <!-- Personal info summary will be dynamically loaded here -->
                    </div>
                </div>
            </div>
        </main>

        <footer class="user-footer">
            <div class="footer-content">
                <p>&copy; 2024 Blue Mountain Bank. All rights reserved.</p>
                <div class="footer-links">
                    <a href="security.html" target="_blank">Security</a>
                    <a href="rates.html" target="_blank">Rates</a>
                    <a href="index.html" target="_blank">Home</a>
                </div>
            </div>
        </footer>
    </div>

    <!-- Loading Screen -->
    <div class="loading-screen" id="loadingScreen">
        <div class="loading-content">
            <img src="img/blue-mountain-bank.png" alt="Blue Mountain Bank" class="loading-logo">
            <div class="loading-text">Loading Dashboard</div>
            <div class="loading-subtitle">Please wait...</div>
        </div>
    </div>

    <script src="js/local-storage-manager.js?v=2.0"></script>
    <script src="js/azure-storage-manager.js?v=2.0"></script>
    <script src="js/storage-factory.js?v=2.0"></script>
    <script src="js/script.js?v=2.0"></script>
    <script>
        // Dashboard management
        class UserDashboard {
            constructor() {
                this.currentUser = null;
                this.storageManager = null;
                this.init();
            }

            async init() {
                // Check if user is logged in
                const currentUserId = sessionStorage.getItem('currentUser');
                if (!currentUserId) {
                    window.location.href = 'login.html';
                    return;
                }

                try {
                    // Initialize storage using StorageFactory for consistency
                    const storageFactory = new StorageFactory();
                    this.storageManager = await storageFactory.getStorageManager();
                    console.log('Storage manager initialized:', this.storageManager.constructor.name);
                    
                    console.log('Loading user data for userId:', currentUserId);
                    
                    // Load user data
                    this.currentUser = await this.storageManager.getUserData(currentUserId);
                    
                    console.log('Loaded user data:', this.currentUser);
                    console.log('User data type:', typeof this.currentUser);
                    console.log('User data keys:', this.currentUser ? Object.keys(this.currentUser) : 'null');
                    
                    if (!this.currentUser) {
                        alert('User data not found. Redirecting to login.');
                        window.location.href = 'login.html';
                        return;
                    }

                    // Verify transaction data
                    console.log('Checking transaction data...');
                    console.log('this.currentUser.transactions:', this.currentUser.transactions);
                    console.log('this.currentUser.recentTransactions:', this.currentUser.recentTransactions);

                    // Initialize dashboard
                    this.loadUserDashboard();
                } catch (error) {
                    console.error('Dashboard initialization error:', error);
                    alert('Failed to load user data. Please try logging in again.');
                    window.location.href = 'login.html';
                }
            }

            loadUserDashboard() {
                // Update page title
                document.title = `${this.currentUser.profile.fullName} - Dashboard - Blue Mountain Bank`;

                // Apply user theme preferences
                this.applyUserTheme();

                // Show loading screen briefly for smooth transition
                const loadingScreen = document.getElementById('loadingScreen');
                loadingScreen.style.display = 'flex';

                setTimeout(() => {
                    this.populateUserInfo();
                    this.populateAccounts();
                    this.populateTransactions();
                    this.populateQuickActions();
                    this.populatePersonalInfo();
                    
                    // Hide loading screen
                    loadingScreen.classList.add('hidden');
                    setTimeout(() => {
                        loadingScreen.style.display = 'none';
                    }, 500);
                }, 800);
            }

            applyUserTheme() {
                // Check user preferences for theme
                const preferences = this.currentUser.preferences || {};
                const theme = preferences.theme || 'light';
                const darkMode = preferences.darkMode || false;

                // Apply dark mode if enabled
                if (theme === 'dark' || darkMode) {
                    document.body.classList.add('dark-mode');
                    document.body.setAttribute('data-theme', 'dark');
                } else {
                    document.body.classList.remove('dark-mode');
                    document.body.setAttribute('data-theme', 'light');
                }

                console.log('Applied theme:', theme, 'Dark mode:', darkMode);
            }

            populateUserInfo() {
                const profile = this.currentUser.profile;
                
                // Update header info
                document.getElementById('userAvatar').textContent = profile.avatar;
                document.getElementById('userName').textContent = profile.fullName;
                document.getElementById('userAccount').textContent = `Account ${profile.accountNumber}`;
                
                // Update welcome section
                document.getElementById('welcomeMessage').textContent = `Welcome back, ${profile.firstName}!`;
                
                // Add data source information
                const dataSource = this.currentUser._dataSource || 'Unknown';
                const dataSourceIndicator = dataSource === 'Azure' ? '☁️ Azure' : '💾 Local';
                
                document.getElementById('userInfo').innerHTML = 
                    `${profile.profession} | Member since ${new Date(profile.joinDate).toLocaleDateString('en-US', { month: 'long', year: 'numeric' })} | <span style="font-size: 0.9em; color: #666;">${dataSourceIndicator}</span>`;
            }

            populateAccounts() {
                const container = document.getElementById('accountsContainer');
                container.innerHTML = '';

                // Add traditional bank accounts only
                Object.entries(this.currentUser.accounts).forEach(([accountType, accountData]) => {
                    const accountCard = this.createAccountCard(accountType, accountData);
                    container.appendChild(accountCard);
                });
            }

            createAccountCard(accountType, accountData) {
                const card = document.createElement('div');
                card.className = 'account-card';
                
                const isNegative = accountData.balance < 0;
                const balanceClass = isNegative ? 'negative' : 'positive';
                const formattedBalance = this.formatCurrency(accountData.balance);

                let additionalInfo = '';
                if (accountType === 'credit') {
                    additionalInfo = `
                        <div style="color: rgba(255, 255, 255, 0.7); font-size: 0.9rem; margin-bottom: 10px;">
                            Credit Limit: ${this.formatCurrency(accountData.limit)}
                        </div>
                    `;
                }

                card.innerHTML = `
                    <div class="account-header">
                        <div class="account-type">${accountData.type}</div>
                        <div class="account-number">${accountData.accountNumber}</div>
                    </div>
                    <div class="account-balance ${balanceClass}">${formattedBalance}</div>
                    ${additionalInfo}
                    <div class="account-actions">
                        ${this.getAccountActions(accountType)}
                    </div>
                `;

                return card;
            }

            createCryptoCard(cryptoType, cryptoData) {
                const card = document.createElement('div');
                card.className = 'account-card crypto-card';
                
                const formattedBalance = this.formatCrypto(cryptoData.balance, cryptoData.symbol);
                const formattedValueUSD = this.formatCurrency(cryptoData.valueUSD);
                const pricePerUnit = this.formatCurrency(cryptoData.pricePerUnit);

                card.innerHTML = `
                    <div class="account-header">
                        <div class="account-type crypto-type">
                            <i class="fab fa-bitcoin crypto-icon"></i>
                            ${cryptoData.name}
                        </div>
                        <div class="crypto-symbol">${cryptoData.symbol}</div>
                    </div>
                    <div class="crypto-balance-section">
                        <div class="crypto-balance">${formattedBalance}</div>
                        <div class="crypto-value-usd">${formattedValueUSD}</div>
                        <div class="crypto-price">@ ${pricePerUnit} per ${cryptoData.symbol}</div>
                    </div>
                    <div class="account-actions">
                        <button class="account-btn crypto-btn">Buy ${cryptoData.symbol}</button>
                        <button class="account-btn crypto-btn">Sell ${cryptoData.symbol}</button>
                        <button class="account-btn crypto-btn">View Wallet</button>
                    </div>
                `;

                return card;
            }

            getAccountActions(accountType) {
                const baseActions = '<button class="account-btn">Transfer</button><button class="account-btn">View Details</button>';
                
                switch (accountType) {
                    case 'checking':
                        return '<button class="account-btn">Transfer</button><button class="account-btn">Pay Bills</button><button class="account-btn">View Details</button>';
                    case 'savings':
                        return '<button class="account-btn">Transfer</button><button class="account-btn">Set Goals</button><button class="account-btn">View Details</button>';
                    case 'credit':
                        return '<button class="account-btn">Make Payment</button><button class="account-btn">View Rewards</button><button class="account-btn">View Details</button>';
                    default:
                        return baseActions;
                }
            }

            populateTransactions() {
                const container = document.getElementById('transactionsList');
                container.innerHTML = '';

                // Check for both 'transactions' and 'recentTransactions' properties
                const transactions = this.currentUser.transactions || this.currentUser.recentTransactions || [];
                console.log('Current user data:', this.currentUser);
                console.log('Found transactions:', transactions.length);
                console.log('Transaction data:', transactions);

                if (transactions.length === 0) {
                    console.log('No transactions found. Available properties:', Object.keys(this.currentUser));
                    container.innerHTML = '<div class="no-transactions">No recent transactions</div>';
                    return;
                }

                transactions.forEach((transaction, index) => {
                    console.log(`Processing transaction ${index}:`, transaction);
                    const transactionItem = this.createTransactionItem(transaction);
                    container.appendChild(transactionItem);
                });
            }

            createTransactionItem(transaction) {
                const item = document.createElement('div');
                item.className = 'transaction-item';
                
                const isPositive = transaction.amount > 0;
                const amountClass = isPositive ? 'positive' : 'negative';
                const amountText = `${isPositive ? '+' : ''}${this.formatCurrency(transaction.amount)}`;
                const formattedDate = new Date(transaction.date).toLocaleDateString('en-US', {
                    year: 'numeric',
                    month: 'long',
                    day: 'numeric'
                });

                // Handle different data structures - Azure vs LocalStorage
                const category = transaction.category || transaction.type || 'general';
                const transactionIcon = transaction.icon || this.getTransactionIcon(transaction.type, category);

                item.innerHTML = `
                    <div class="transaction-icon">
                        <i class="${transactionIcon}"></i>
                    </div>
                    <div class="transaction-info">
                        <div class="transaction-description">${transaction.description}</div>
                        <div class="transaction-date">${formattedDate}</div>
                        <div class="transaction-category">${this.capitalizeFirst(category)}</div>
                    </div>
                    <div class="transaction-amount ${amountClass}">${amountText}</div>
                `;

                return item;
            }

            // Helper method to get transaction icon based on type/category
            getTransactionIcon(type, category) {
                // Default icons based on transaction type
                const typeIcons = {
                    'deposit': 'fas fa-plus-circle',
                    'withdrawal': 'fas fa-minus-circle',
                    'transfer': 'fas fa-exchange-alt'
                };

                // More specific icons based on category
                const categoryIcons = {
                    'salary': 'fas fa-money-bill-wave',
                    'income': 'fas fa-money-bill-wave',
                    'groceries': 'fas fa-shopping-cart',
                    'dining': 'fas fa-utensils',
                    'transportation': 'fas fa-car',
                    'utilities': 'fas fa-bolt',
                    'entertainment': 'fas fa-tv',
                    'healthcare': 'fas fa-pills',
                    'shopping': 'fas fa-shopping-bag',
                    'business': 'fas fa-briefcase',
                    'general': 'fas fa-circle'
                };

                // Return category icon if available, otherwise type icon, otherwise default
                return categoryIcons[category.toLowerCase()] || typeIcons[type] || 'fas fa-circle';
            }

            populateQuickActions() {
                const container = document.getElementById('quickActionsContainer');
                container.innerHTML = '';

                const actions = this.getQuickActionsForUser();
                actions.forEach(action => {
                    const actionCard = this.createActionCard(action);
                    container.appendChild(actionCard);
                });
            }

            getQuickActionsForUser() {
                const profession = this.currentUser.profile.profession.toLowerCase();
                
                // Base actions for all users (including Personal Info and Crypto)
                const baseActions = [
                    { icon: 'fas fa-user-shield', title: 'Personal Info', href: 'personal-info.html' },
                    { icon: 'fab fa-bitcoin', title: 'Crypto Portfolio', href: 'crypto-portfolio.html' },
                    { icon: 'fas fa-credit-card', title: 'Credit Card Transactions', href: 'credit-card-transactions.html' },
                    { icon: 'fas fa-exchange-alt', title: 'Transfer Money' },
                    { icon: 'fas fa-money-bill', title: 'Pay Bills' },
                    { icon: 'fas fa-cog', title: 'Settings', href: 'settings.html' }
                ];

                // Profession-specific actions (removed Investment and Mobile Deposit)
                let specificActions = [];
                
                if (profession.includes('engineer') || profession.includes('software')) {
                    specificActions = [
                        { icon: 'fas fa-university', title: 'Loan Application' },
                        { icon: 'fas fa-chart-bar', title: 'Reports' }
                    ];
                } else if (profession.includes('business') || profession.includes('owner')) {
                    specificActions = [
                        { icon: 'fas fa-chart-bar', title: 'Business Reports' },
                        { icon: 'fas fa-handshake', title: 'Business Loan' },
                        { icon: 'fas fa-receipt', title: 'Invoicing' }
                    ];
                } else if (profession.includes('student')) {
                    specificActions = [
                        { icon: 'fas fa-graduation-cap', title: 'Student Loans' },
                        { icon: 'fas fa-piggy-bank', title: 'Save for Goals' }
                    ];
                } else if (profession.includes('retired')) {
                    specificActions = [
                        { icon: 'fas fa-heart', title: 'Charity Donations' },
                        { icon: 'fas fa-shield-alt', title: 'Insurance' },
                        { icon: 'fas fa-chart-pie', title: 'Retirement Planning' }
                    ];
                } else if (profession.includes('marketing') || profession.includes('manager')) {
                    specificActions = [
                        { icon: 'fas fa-credit-card', title: 'Rewards Program' },
                        { icon: 'fas fa-spa', title: 'Premium Services' }
                    ];
                } else if (profession.includes('construction') || profession.includes('foreman')) {
                    specificActions = [
                        { icon: 'fas fa-home', title: 'Home Equity Loan' },
                        { icon: 'fas fa-tools', title: 'Equipment Financing' },
                        { icon: 'fas fa-truck', title: 'Auto Loans' }
                    ];
                } else {
                    specificActions = [
                        { icon: 'fas fa-shield-alt', title: 'Insurance' },
                        { icon: 'fas fa-chart-bar', title: 'Reports' }
                    ];
                }

                return [...baseActions, ...specificActions];
            }

            createActionCard(action) {
                const card = document.createElement('div');
                card.className = 'action-card';
                
                // If action has a href, make it clickable
                if (action.href) {
                    card.style.cursor = 'pointer';
                    card.addEventListener('click', () => {
                        window.location.href = action.href;
                    });
                }
                
                card.innerHTML = `
                    <div class="action-icon">
                        <i class="${action.icon}"></i>
                    </div>
                    <div class="action-title">${action.title}</div>
                `;

                return card;
            }

            populatePersonalInfo() {
                const container = document.getElementById('personalInfoSummary');
                const personalInfo = this.currentUser.personalInfo;
                
                if (!personalInfo) {
                    container.innerHTML = `
                        <div class="personal-info-item">
                            <div class="personal-info-label">
                                <i class="fas fa-info-circle"></i>
                                No personal information available
                            </div>
                            <div class="personal-info-value" onclick="window.location.href='personal-info.html'">
                                Add Information
                            </div>
                        </div>
                    `;
                    return;
                }

                let html = '';

                // SSN
                if (personalInfo.ssn) {
                    const maskedSSN = this.maskSSN(personalInfo.ssn);
                    html += `
                        <div class="personal-info-item">
                            <div class="personal-info-label">
                                <i class="fas fa-id-card"></i>
                                Social Security Number
                            </div>
                            <div class="personal-info-value" onclick="window.location.href='personal-info.html'">
                                ${maskedSSN}
                            </div>
                        </div>
                    `;
                }

                // Date of Birth
                if (personalInfo.dateOfBirth) {
                    const dob = new Date(personalInfo.dateOfBirth);
                    const formattedDOB = dob.toLocaleDateString('en-US', { 
                        year: 'numeric', 
                        month: 'short', 
                        day: 'numeric' 
                    });
                    html += `
                        <div class="personal-info-item">
                            <div class="personal-info-label">
                                <i class="fas fa-birthday-cake"></i>
                                Date of Birth
                            </div>
                            <div class="personal-info-value" onclick="window.location.href='personal-info.html'">
                                ${formattedDOB}
                            </div>
                        </div>
                    `;
                }

                // Credit Cards
                if (personalInfo.creditCards) {
                    const creditCards = Object.entries(personalInfo.creditCards);
                    if (creditCards.length > 0) {
                        html += `
                            <div class="personal-info-item">
                                <div class="personal-info-label">
                                    <i class="fas fa-credit-card"></i>
                                    Credit Cards (${creditCards.length})
                                </div>
                                <div class="credit-cards-summary">
                        `;
                        
                        creditCards.forEach(([cardId, cardData]) => {
                            const maskedNumber = this.maskCreditCard(cardData.number);
                            const statusClass = cardData.isActive ? 'card-active' : 'card-inactive';
                            const statusText = cardData.isActive ? 'Active' : 'Inactive';
                            
                            html += `
                                <div class="credit-card-summary" onclick="window.location.href='personal-info.html'">
                                    <div class="card-summary-left">
                                        <span class="card-summary-type">${cardData.type.toUpperCase()}</span>
                                        <span class="card-summary-number">${maskedNumber}</span>
                                    </div>
                                    <span class="card-status ${statusClass}">${statusText}</span>
                                </div>
                            `;
                        });
                        
                        html += `
                                </div>
                            </div>
                        `;
                    }
                }

                container.innerHTML = html;
            }

            maskSSN(ssn) {
                if (!ssn) return '***-**-****';
                const clean = ssn.replace(/\D/g, '');
                if (clean.length === 9) {
                    return `***-**-${clean.substring(5)}`;
                }
                return '***-**-****';
            }

            maskCreditCard(cardNumber) {
                if (!cardNumber) return '**** **** **** ****';
                const clean = cardNumber.replace(/\D/g, '');
                if (clean.length >= 13) {
                    const lastFour = clean.substring(clean.length - 4);
                    return `**** **** **** ${lastFour}`;
                }
                return '**** **** **** ****';
            }

            formatCurrency(amount) {
                return new Intl.NumberFormat('en-US', {
                    style: 'currency',
                    currency: 'USD'
                }).format(Math.abs(amount));
            }

            formatCrypto(amount, symbol) {
                // For crypto, we want to show more decimal places and no currency symbol
                const num = Number(amount);
                if (num === 0) return `0 ${symbol}`;
                
                // Show 8 decimal places for most cryptos, but trim trailing zeros
                let formatted = num.toFixed(8).replace(/\.?0+$/, '');
                
                // Add thousand separators for large amounts
                const parts = formatted.split('.');
                parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
                
                return `${parts.join('.')} ${symbol}`;
            }

            capitalizeFirst(str) {
                return str.charAt(0).toUpperCase() + str.slice(1);
            }
        }

        // Initialize dashboard when page loads
        document.addEventListener('DOMContentLoaded', function() {
            new UserDashboard();
        });

        function logout() {
            if (confirm('Are you sure you want to logout?')) {
                sessionStorage.removeItem('currentUser');
                sessionStorage.removeItem('loginTime');
                sessionStorage.removeItem('storageType');
                sessionStorage.removeItem('dataSource');
                window.location.href = 'index.html';
            }
        }
    </script>
</body>
</html>
