<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Personal Info Page</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .info-box { border: 1px solid #ccc; padding: 10px; margin: 10px 0; }
        button { margin: 5px; padding: 8px 16px; }
    </style>
</head>
<body>
    <h1>Test Personal Info Page</h1>
    
    <button onclick="simulateLogin()">Simulate Login</button>
    <button onclick="testPersonalInfoManager()">Test Personal Info Manager</button>
    <button onclick="checkSessionStorage()">Check Session Storage</button>
    
    <div id="status"></div>
    
    <div class="info-box">
        <h3>Personal Information</h3>
        <p><strong>SSN:</strong> <span id="ssnDisplay">Loading...</span></p>
        <p><strong>Date of Birth:</strong> <span id="dobDisplay">Loading...</span></p>
        <p><strong>Mother's Maiden Name:</strong> <span id="maidenNameDisplay">Loading...</span></p>
        
        <div id="creditCardsContainer">
            Loading credit cards...
        </div>
        
        <button onclick="generateNewTestData()">Generate New Test Data</button>
    </div>

    <!-- Scripts -->
    <script src="js/sensitive-data-generator.js"></script>
    <script src="js/azure-blob-storage-manager.js"></script>
    <script src="js/local-storage-manager.js"></script>
    <script src="js/storage-factory.js"></script>
    
    <script>
        // Simplified Personal Info Manager for testing
        class TestPersonalInfoManager {
            constructor() {
                this.currentUser = null;
                this.storageManager = null;
                this.sensitiveDataGenerator = new SensitiveDataGenerator();
                this.visibilityStates = {
                    ssn: false,
                    maidenName: false
                };
            }

            async init() {
                try {
                    console.log('Initializing test personal info manager...');
                    
                    // Try to initialize storage
                    try {
                        const storageFactory = new StorageFactory();
                        this.storageManager = await storageFactory.getStorageManager();
                        console.log('Storage manager initialized:', this.storageManager);
                    } catch (error) {
                        console.warn('Storage manager failed, using fallback:', error);
                        this.storageManager = null;
                    }
                    
                    // Load current user data
                    const currentUserData = sessionStorage.getItem('currentUser');
                    if (currentUserData) {
                        this.currentUser = JSON.parse(currentUserData);
                        console.log('Current user from session:', this.currentUser);
                        this.updateDisplay();
                    } else {
                        console.log('No current user found');
                        document.getElementById('status').innerHTML = '<p style="color: red;">No user logged in. Click "Simulate Login" first.</p>';
                    }
                } catch (error) {
                    console.error('Failed to initialize:', error);
                    document.getElementById('status').innerHTML = `<p style="color: red;">Initialization failed: ${error.message}</p>`;
                }
            }

            updateDisplay() {
                console.log('Updating display with user data:', this.currentUser);
                
                // Ensure personalInfo exists
                if (!this.currentUser.personalInfo) {
                    this.currentUser.personalInfo = {};
                    console.log('Created empty personalInfo object');
                }
                
                const personalInfo = this.currentUser.personalInfo;
                
                // SSN
                const ssnElement = document.getElementById('ssnDisplay');
                if (ssnElement) {
                    if (personalInfo.ssn) {
                        ssnElement.textContent = this.sensitiveDataGenerator.maskSSN(personalInfo.ssn);
                    } else {
                        ssnElement.textContent = 'Not provided';
                    }
                }

                // Date of Birth
                const dobElement = document.getElementById('dobDisplay');
                if (dobElement) {
                    if (personalInfo.dateOfBirth) {
                        try {
                            const date = new Date(personalInfo.dateOfBirth);
                            dobElement.textContent = date.toLocaleDateString('en-US', { 
                                year: 'numeric', 
                                month: 'long', 
                                day: 'numeric' 
                            });
                        } catch (error) {
                            console.error('Error formatting date:', error);
                            dobElement.textContent = 'Invalid date';
                        }
                    } else {
                        dobElement.textContent = 'Not provided';
                    }
                }

                // Mother's Maiden Name
                const maidenNameElement = document.getElementById('maidenNameDisplay');
                if (maidenNameElement) {
                    if (personalInfo.mothersMaidenName) {
                        maidenNameElement.textContent = '*'.repeat(personalInfo.mothersMaidenName.length);
                    } else {
                        maidenNameElement.textContent = 'Not provided';
                    }
                }

                // Credit Cards
                this.updateCreditCardsDisplay();
                
                document.getElementById('status').innerHTML = '<p style="color: green;">Display updated successfully!</p>';
            }

            updateCreditCardsDisplay() {
                const container = document.getElementById('creditCardsContainer');
                container.innerHTML = '';

                const creditCards = this.currentUser.personalInfo?.creditCards || {};
                
                if (Object.keys(creditCards).length === 0) {
                    container.innerHTML = '<p>No credit cards on file</p>';
                    return;
                }
                
                Object.entries(creditCards).forEach(([cardId, cardData]) => {
                    const maskedNumber = this.sensitiveDataGenerator.maskCreditCard(cardData.number);
                    const cardDiv = document.createElement('div');
                    cardDiv.style.border = '1px solid #ddd';
                    cardDiv.style.padding = '10px';
                    cardDiv.style.margin = '5px 0';
                    cardDiv.innerHTML = `
                        <strong>${cardData.name} (${cardData.type.toUpperCase()})</strong><br>
                        ${maskedNumber}<br>
                        Expires: ${cardData.expiryMonth.toString().padStart(2, '0')}/${cardData.expiryYear.toString().substr(-2)}
                    `;
                    container.appendChild(cardDiv);
                });
            }

            async generateNewTestData() {
                if (confirm('This will replace your current sensitive data with new test data. Continue?')) {
                    console.log('Generating new test data...');
                    const newData = this.sensitiveDataGenerator.generateSamplePersonalInfo();
                    const dateOfBirth = this.sensitiveDataGenerator.generateRandomDateOfBirth();
                    const mothersMaidenName = this.sensitiveDataGenerator.generateRandomMaidenName();
                    
                    console.log('Generated data:', newData);
                    console.log('Date of birth:', dateOfBirth);
                    console.log('Maiden name:', mothersMaidenName);
                    
                    // Update current user data
                    this.currentUser.personalInfo = {
                        ...this.currentUser.personalInfo,
                        ssn: newData.ssn,
                        dateOfBirth: dateOfBirth,
                        mothersMaidenName: mothersMaidenName,
                        creditCards: newData.creditCards
                    };

                    console.log('Updated user data:', this.currentUser);

                    // Update session storage
                    sessionStorage.setItem('currentUser', JSON.stringify(this.currentUser));
                    
                    // Try to save to storage if available
                    if (this.storageManager) {
                        try {
                            await this.storageManager.saveUserData(this.currentUser.userId, this.currentUser);
                            console.log('Data saved to storage successfully');
                        } catch (error) {
                            console.warn('Failed to save to storage:', error);
                        }
                    }
                    
                    // Refresh display
                    this.updateDisplay();
                    
                    alert('New test data generated successfully!');
                }
            }
        }

        let testManager;

        function simulateLogin() {
            // Simulate a logged-in user
            const testUser = {
                userId: 'alice_martinez',
                profile: {
                    fullName: 'Alice Martinez',
                    firstName: 'Alice',
                    lastName: 'Martinez'
                },
                personalInfo: {
                    ssn: '123-45-6789',
                    dateOfBirth: '1990-05-15',
                    mothersMaidenName: 'Johnson',
                    creditCards: {
                        primary: {
                            type: 'visa',
                            number: '4111111111111111',
                            expiryMonth: 12,
                            expiryYear: 2028,
                            cvv: 123,
                            name: 'Primary Visa',
                            isActive: true
                        }
                    }
                }
            };
            
            sessionStorage.setItem('currentUser', JSON.stringify(testUser));
            sessionStorage.setItem('loginTime', new Date().toISOString());
            
            document.getElementById('status').innerHTML = '<p style="color: green;">Simulated login successful!</p>';
            
            if (testManager) {
                testManager.init();
            }
        }

        function testPersonalInfoManager() {
            if (!testManager) {
                testManager = new TestPersonalInfoManager();
            }
            testManager.init();
        }

        function checkSessionStorage() {
            const currentUser = sessionStorage.getItem('currentUser');
            const loginTime = sessionStorage.getItem('loginTime');
            
            document.getElementById('status').innerHTML = `
                <h3>Session Storage:</h3>
                <p><strong>Current User:</strong> ${currentUser ? 'Found' : 'Not found'}</p>
                <p><strong>Login Time:</strong> ${loginTime || 'Not set'}</p>
                ${currentUser ? `<pre>${JSON.stringify(JSON.parse(currentUser), null, 2)}</pre>` : ''}
            `;
        }

        function generateNewTestData() {
            if (testManager) {
                testManager.generateNewTestData();
            } else {
                alert('Please test Personal Info Manager first');
            }
        }

        // Initialize on page load
        document.addEventListener('DOMContentLoaded', () => {
            console.log('Test page loaded');
            checkSessionStorage();
        });
    </script>
</body>
</html>
