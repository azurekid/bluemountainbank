<!DOCTYPE html>
<html>
<head>
    <title>Azure Storage Debug - Blue Mountain Bank</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background: #f5f5f5; }
        .container { max-width: 1200px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; }
        .section { margin: 20px 0; padding: 15px; border: 1px solid #ddd; border-radius: 5px; }
        .success { background-color: #d4edda; border-color: #c3e6cb; }
        .error { background-color: #f8d7da; border-color: #f5c6cb; }
        .info { background-color: #d1ecf1; border-color: #bee5eb; }
        pre { background: #f8f9fa; padding: 10px; overflow-x: auto; white-space: pre-wrap; font-size: 12px; }
        button { margin: 5px; padding: 10px 15px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Azure Storage Debug - Blue Mountain Bank</h1>
        
        <div class="section">
            <h2>1. Test Azure Blob List</h2>
            <button onclick="testBlobList()">List All Blobs</button>
            <div id="blobResults"></div>
        </div>

        <div class="section">
            <h2>2. Test Direct File Access</h2>
            <button onclick="testDirectAccess()">Test alice_martinez.json</button>
            <div id="directResults"></div>
        </div>

        <div class="section">
            <h2>3. Test Authentication Logic</h2>
            <button onclick="testAuthLogic()">Debug Authentication</button>
            <div id="authResults"></div>
        </div>
    </div>

    <script src="js/azure-storage-manager.js"></script>
    <script>
        function addResult(containerId, message, type = 'info') {
            const container = document.getElementById(containerId);
            const div = document.createElement('div');
            div.className = `section ${type}`;
            div.innerHTML = message;
            container.appendChild(div);
        }

        async function testBlobList() {
            const container = document.getElementById('blobResults');
            container.innerHTML = '';
            
            try {
                const manager = new AzureStorageManager();
                await manager.initialize();
                
                const userListUrl = `${manager.baseUrl}?restype=container&comp=list&prefix=users/&${manager.sasToken}`;
                addResult('blobResults', `Testing URL: ${userListUrl}`, 'info');
                
                const response = await fetch(userListUrl);
                addResult('blobResults', `Response status: ${response.status} ${response.statusText}`, response.ok ? 'success' : 'error');
                
                if (response.ok) {
                    const xmlText = await response.text();
                    addResult('blobResults', `Response length: ${xmlText.length} characters`, 'info');
                    
                    const parser = new DOMParser();
                    const xmlDoc = parser.parseFromString(xmlText, 'text/xml');
                    const blobs = xmlDoc.getElementsByTagName('Blob');
                    
                    addResult('blobResults', `Found ${blobs.length} blobs:`, 'success');
                    
                    for (let i = 0; i < blobs.length; i++) {
                        const blobName = blobs[i].getElementsByTagName('Name')[0].textContent;
                        addResult('blobResults', `Blob ${i + 1}: ${blobName}`, 'info');
                    }
                    
                    addResult('blobResults', `<pre>Full XML Response:\n${xmlText}</pre>`, 'info');
                } else {
                    const errorText = await response.text();
                    addResult('blobResults', `Error: ${errorText}`, 'error');
                }
                
            } catch (error) {
                addResult('blobResults', `Error: ${error.message}`, 'error');
            }
        }

        async function testDirectAccess() {
            const container = document.getElementById('directResults');
            container.innerHTML = '';
            
            try {
                const manager = new AzureStorageManager();
                await manager.initialize();
                
                // Test the exact URL that would be used for alice_martinez
                const testUrl = `${manager.baseUrl}/users/alice_martinez.json?${manager.sasToken}`;
                addResult('directResults', `Testing direct URL: ${testUrl}`, 'info');
                
                const response = await fetch(testUrl);
                addResult('directResults', `Response status: ${response.status} ${response.statusText}`, response.ok ? 'success' : 'error');
                
                if (response.ok) {
                    const userData = await response.json();
                    addResult('directResults', `✅ Successfully loaded user data!`, 'success');
                    addResult('directResults', `Username: ${userData.credentials?.username}`, 'info');
                    addResult('directResults', `Password hash: ${userData.credentials?.password?.substring(0, 20)}...`, 'info');
                    addResult('directResults', `<pre>${JSON.stringify(userData, null, 2)}</pre>`, 'info');
                } else {
                    const errorText = await response.text();
                    addResult('directResults', `Error: ${errorText}`, 'error');
                }
                
            } catch (error) {
                addResult('directResults', `Error: ${error.message}`, 'error');
            }
        }

        async function testAuthLogic() {
            const container = document.getElementById('authResults');
            container.innerHTML = '';
            
            try {
                const manager = new AzureStorageManager();
                await manager.initialize();
                
                addResult('authResults', 'Testing authentication logic step by step...', 'info');
                addResult('authResults', `useLocalFallback: ${manager.useLocalFallback}`, 'info');
                
                // Force Azure authentication
                manager.useLocalFallback = false;
                
                const username = 'alice.martinez';
                const password = 'AliceM2024!';
                
                addResult('authResults', `Testing credentials: ${username} / ${password}`, 'info');
                
                try {
                    const result = await manager.authenticateUserAzure(username, password);
                    addResult('authResults', `Azure auth result: ${JSON.stringify(result, null, 2)}`, result.success ? 'success' : 'error');
                } catch (azureError) {
                    addResult('authResults', `Azure auth error: ${azureError.message}`, 'error');
                    addResult('authResults', `Stack: ${azureError.stack}`, 'error');
                }
                
            } catch (error) {
                addResult('authResults', `Error: ${error.message}`, 'error');
            }
        }

        // Auto-run blob list test on page load
        window.addEventListener('load', () => {
            testBlobList();
        });
    </script>
</body>
</html>
