<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Full Flow Test - Blue Mountain Bank</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background: #f5f5f5; }
        .test-panel { background: white; padding: 20px; border-radius: 8px; margin: 10px 0; }
        .error { color: red; background: #ffebee; padding: 10px; border-radius: 4px; margin: 5px 0; }
        .success { color: green; background: #e8f5e9; padding: 10px; border-radius: 4px; margin: 5px 0; }
        .warning { color: orange; background: #fff3e0; padding: 10px; border-radius: 4px; margin: 5px 0; }
        .info { color: blue; background: #e3f2fd; padding: 10px; border-radius: 4px; margin: 5px 0; }
        button { padding: 10px 20px; margin: 5px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #0056b3; }
        pre { background: #f5f5f5; padding: 10px; border-radius: 4px; overflow-x: auto; font-size: 12px; }
        .step { border: 1px solid #ddd; margin: 10px 0; padding: 15px; border-radius: 8px; }
        .step-title { font-weight: bold; margin-bottom: 10px; }
    </style>
</head>
<body>
    <div class="test-panel">
        <h1>🧪 Full Flow Test</h1>
        <p>This page tests the complete user data flow from login to personal info management.</p>
        
        <div id="step1" class="step">
            <div class="step-title">Step 1: Initialize Storage System</div>
            <button onclick="testStep1()">Test Storage Initialization</button>
            <div id="step1Results"></div>
        </div>

        <div id="step2" class="step">
            <div class="step-title">Step 2: Simulate Login</div>
            <button onclick="testStep2()">Simulate Alice Login</button>
            <div id="step2Results"></div>
        </div>

        <div id="step3" class="step">
            <div class="step-title">Step 3: Load User Data</div>
            <button onclick="testStep3()">Load User Data</button>
            <div id="step3Results"></div>
        </div>

        <div id="step4" class="step">
            <div class="step-title">Step 4: Test Personal Info Manager</div>
            <button onclick="testStep4()">Test Personal Info Manager</button>
            <div id="step4Results"></div>
        </div>

        <div id="step5" class="step">
            <div class="step-title">Step 5: Test Data Generation</div>
            <button onclick="testStep5()">Test Data Generation</button>
            <div id="step5Results"></div>
        </div>

        <div id="navigation" class="step">
            <div class="step-title">Navigation</div>
            <button onclick="goToLogin()">Go to Login</button>
            <button onclick="goToDashboard()">Go to Dashboard</button>
            <button onclick="goToPersonalInfo()">Go to Personal Info</button>
        </div>
    </div>

    <!-- Load all necessary scripts -->
    <script src="js/local-storage-manager.js?v=2.0"></script>
    <script src="js/azure-storage-manager.js?v=2.0"></script>
    <script src="js/storage-factory.js?v=2.0"></script>
    <script src="js/sensitive-data-generator.js?v=2.0"></script>

    <script>
        function logResult(message, type = 'info', stepId) {
            const container = document.getElementById(stepId + 'Results');
            const div = document.createElement('div');
            div.className = type;
            div.innerHTML = `${new Date().toLocaleTimeString()}: ${message}`;
            container.appendChild(div);
            console.log(`[${stepId}] ${message}`);
        }

        async function testStep1() {
            const stepId = 'step1';
            document.getElementById(stepId + 'Results').innerHTML = '';
            
            try {
                logResult('Testing StorageFactory availability...', 'info', stepId);
                
                if (typeof StorageFactory === 'undefined') {
                    throw new Error('StorageFactory is not defined');
                }
                logResult('✅ StorageFactory is available', 'success', stepId);
                
                const factory = new StorageFactory();
                logResult('✅ StorageFactory instance created', 'success', stepId);
                
                logResult(`Storage type detected: ${factory.getStorageType()}`, 'info', stepId);
                
                const manager = await factory.getStorageManager();
                logResult(`✅ Storage manager initialized: ${manager.constructor.name}`, 'success', stepId);
                
                // Store for other tests
                window.testStorageManager = manager;
                
            } catch (error) {
                logResult(`❌ Error: ${error.message}`, 'error', stepId);
            }
        }

        async function testStep2() {
            const stepId = 'step2';
            document.getElementById(stepId + 'Results').innerHTML = '';
            
            try {
                logResult('Simulating login as alice_martinez...', 'info', stepId);
                
                // Simulate what login.js does
                const userId = 'alice_martinez';
                sessionStorage.setItem('currentUser', userId);
                sessionStorage.setItem('loginTime', new Date().toISOString());
                sessionStorage.setItem('storageType', 'local');
                
                logResult('✅ Session data set', 'success', stepId);
                logResult(`User ID: ${sessionStorage.getItem('currentUser')}`, 'info', stepId);
                logResult(`Login Time: ${sessionStorage.getItem('loginTime')}`, 'info', stepId);
                
            } catch (error) {
                logResult(`❌ Error: ${error.message}`, 'error', stepId);
            }
        }

        async function testStep3() {
            const stepId = 'step3';
            document.getElementById(stepId + 'Results').innerHTML = '';
            
            try {
                if (!window.testStorageManager) {
                    throw new Error('Storage manager not initialized. Run Step 1 first.');
                }
                
                const userId = sessionStorage.getItem('currentUser');
                if (!userId) {
                    throw new Error('No user logged in. Run Step 2 first.');
                }
                
                logResult(`Loading user data for: ${userId}`, 'info', stepId);
                
                const userData = await window.testStorageManager.getUserData(userId);
                
                if (userData) {
                    logResult('✅ User data loaded successfully', 'success', stepId);
                    logResult(`User profile: ${userData.profile?.fullName || 'No name'}`, 'info', stepId);
                    
                    if (userData.personalInfo) {
                        logResult('✅ Personal info found', 'success', stepId);
                        logResult(`SSN: ${userData.personalInfo.ssn || 'Not set'}`, 'info', stepId);
                        logResult(`DOB: ${userData.personalInfo.dateOfBirth || 'Not set'}`, 'info', stepId);
                        logResult(`Maiden Name: ${userData.personalInfo.mothersMaidenName || 'Not set'}`, 'info', stepId);
                        
                        // Show credit cards
                        if (userData.personalInfo.creditCards) {
                            const cards = Object.keys(userData.personalInfo.creditCards);
                            logResult(`Credit Cards: ${cards.length} found (${cards.join(', ')})`, 'info', stepId);
                        }
                    } else {
                        logResult('⚠️ No personal info in user data', 'warning', stepId);
                    }
                    
                    // Store for other tests
                    window.testUserData = userData;
                    
                } else {
                    logResult('❌ No user data found', 'error', stepId);
                }
                
            } catch (error) {
                logResult(`❌ Error: ${error.message}`, 'error', stepId);
            }
        }

        async function testStep4() {
            const stepId = 'step4';
            document.getElementById(stepId + 'Results').innerHTML = '';
            
            try {
                logResult('Testing PersonalInfoManager initialization...', 'info', stepId);
                
                // Simulate what personal-info.html does
                const userId = sessionStorage.getItem('currentUser');
                if (!userId) {
                    throw new Error('No user logged in. Run Step 2 first.');
                }
                
                // Create a mock PersonalInfoManager
                class TestPersonalInfoManager {
                    constructor() {
                        this.currentUser = null;
                        this.storageManager = null;
                        this.sensitiveDataGenerator = new SensitiveDataGenerator();
                    }

                    async init() {
                        const currentUserId = sessionStorage.getItem('currentUser');
                        if (currentUserId) {
                            this.currentUser = { userId: currentUserId };
                            
                            const storageFactory = new StorageFactory();
                            this.storageManager = await storageFactory.getStorageManager();
                            
                            const userData = await this.storageManager.getUserData(this.currentUser.userId);
                            if (userData) {
                                this.currentUser = { userId: this.currentUser.userId, ...userData };
                            }
                            
                            return true;
                        }
                        return false;
                    }
                }
                
                const manager = new TestPersonalInfoManager();
                const success = await manager.init();
                
                if (success) {
                    logResult('✅ PersonalInfoManager initialized successfully', 'success', stepId);
                    logResult(`Current user: ${manager.currentUser.profile?.fullName || 'Unknown'}`, 'info', stepId);
                    logResult(`Storage manager: ${manager.storageManager.constructor.name}`, 'info', stepId);
                    
                    // Store for other tests
                    window.testPersonalInfoManager = manager;
                } else {
                    logResult('❌ PersonalInfoManager initialization failed', 'error', stepId);
                }
                
            } catch (error) {
                logResult(`❌ Error: ${error.message}`, 'error', stepId);
            }
        }

        async function testStep5() {
            const stepId = 'step5';
            document.getElementById(stepId + 'Results').innerHTML = '';
            
            try {
                if (!window.testPersonalInfoManager) {
                    throw new Error('PersonalInfoManager not initialized. Run Step 4 first.');
                }
                
                logResult('Testing data generation...', 'info', stepId);
                
                const manager = window.testPersonalInfoManager;
                const generator = manager.sensitiveDataGenerator;
                
                // Test individual generation functions
                const newSSN = generator.generateSSN();
                const newDOB = generator.generateRandomDateOfBirth();
                const newMaidenName = generator.generateRandomMaidenName();
                const newSampleData = generator.generateSamplePersonalInfo();
                
                logResult(`✅ Generated SSN: ${newSSN}`, 'success', stepId);
                logResult(`✅ Generated DOB: ${newDOB}`, 'success', stepId);
                logResult(`✅ Generated Maiden Name: ${newMaidenName}`, 'success', stepId);
                logResult(`✅ Generated Sample Data with ${Object.keys(newSampleData.creditCards).length} credit cards`, 'success', stepId);
                
                // Test saving
                logResult('Testing data saving...', 'info', stepId);
                
                // Update user data
                manager.currentUser.personalInfo = {
                    ...manager.currentUser.personalInfo,
                    ssn: newSSN,
                    dateOfBirth: newDOB,
                    mothersMaidenName: newMaidenName,
                    creditCards: newSampleData.creditCards
                };
                
                // Save
                await manager.storageManager.saveUserData(manager.currentUser.userId, manager.currentUser);
                logResult('✅ Data saved successfully', 'success', stepId);
                
                // Verify by reloading
                const reloadedData = await manager.storageManager.getUserData(manager.currentUser.userId);
                if (reloadedData.personalInfo?.ssn === newSSN) {
                    logResult('✅ Data persistence verified', 'success', stepId);
                } else {
                    logResult('❌ Data persistence failed', 'error', stepId);
                }
                
            } catch (error) {
                logResult(`❌ Error: ${error.message}`, 'error', stepId);
            }
        }

        function goToLogin() {
            window.location.href = 'login.html';
        }

        function goToDashboard() {
            window.location.href = 'user-dashboard.html';
        }

        function goToPersonalInfo() {
            window.location.href = 'personal-info.html';
        }
    </script>
</body>
</html>
