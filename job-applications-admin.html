<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Applications Admin - Blue Mountain Bank</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/header.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .admin-main {
            margin-top: 80px;
            padding: 40px 0;
            min-height: calc(100vh - 80px);
            background: linear-gradient(135deg, rgba(30, 64, 175, 0.6) 0%, rgba(59, 130, 246, 0.5) 50%, rgba(96, 165, 250, 0.4) 100%);
        }
        
        .admin-container {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 20px;
            padding: 40px;
            margin: 20px auto;
            max-width: 1200px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.15), 0 0 0 1px rgba(255, 255, 255, 0.1);
        }
        
        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }
        
        .admin-header h1 {
            color: #ffffff;
            font-size: 2.2rem;
            font-weight: 700;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
        }
        
        .admin-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }
        
        .stat-card {
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 15px;
            padding: 25px;
            text-align: center;
        }
        
        .stat-card h3 {
            color: #ffffff;
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 10px;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.2);
        }
        
        .stat-card p {
            color: rgba(255, 255, 255, 0.8);
            font-size: 1rem;
        }
        
        .filters {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        
        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        
        .filter-group label {
            color: rgba(255, 255, 255, 0.9);
            font-weight: 500;
            font-size: 0.9rem;
        }
        
        .filter-group select,
        .filter-group input {
            padding: 10px 15px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            color: #ffffff;
            font-size: 0.9rem;
        }
        
        .applications-table {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 15px;
            overflow: hidden;
        }
        
        .table-header {
            background: rgba(255, 255, 255, 0.15);
            padding: 20px;
            display: grid;
            grid-template-columns: 2fr 1.5fr 1fr 1fr 1fr 1fr;
            gap: 20px;
            font-weight: 600;
            color: #ffffff;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .application-row {
            padding: 20px;
            display: grid;
            grid-template-columns: 2fr 1.5fr 1fr 1fr 1fr 1fr;
            gap: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }
        
        .application-row:hover {
            background: rgba(255, 255, 255, 0.1);
        }
        
        .application-row:last-child {
            border-bottom: none;
        }
        
        .applicant-info {
            color: #ffffff;
        }
        
        .applicant-name {
            font-weight: 600;
            margin-bottom: 5px;
        }
        
        .applicant-email {
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.9rem;
        }
        
        .position-info {
            color: rgba(255, 255, 255, 0.9);
        }
        
        .position-title {
            font-weight: 500;
            margin-bottom: 3px;
        }
        
        .position-department {
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.85rem;
        }
        
        .application-date {
            color: rgba(255, 255, 255, 0.8);
            font-size: 0.9rem;
        }
        
        .status-badge {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 500;
            text-align: center;
        }
        
        .status-new {
            background: rgba(34, 197, 94, 0.2);
            color: #22c55e;
            border: 1px solid rgba(34, 197, 94, 0.3);
        }
        
        .status-reviewed {
            background: rgba(59, 130, 246, 0.2);
            color: #3b82f6;
            border: 1px solid rgba(59, 130, 246, 0.3);
        }
        
        .status-interview {
            background: rgba(245, 158, 11, 0.2);
            color: #f59e0b;
            border: 1px solid rgba(245, 158, 11, 0.3);
        }
        
        .status-rejected {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }
        
        .actions {
            display: flex;
            gap: 10px;
        }
        
        .action-btn {
            padding: 8px 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8rem;
            transition: all 0.3s ease;
        }
        
        .view-btn {
            background: rgba(59, 130, 246, 0.8);
            color: white;
        }
        
        .view-btn:hover {
            background: rgba(59, 130, 246, 1);
        }
        
        .download-btn {
            background: rgba(34, 197, 94, 0.8);
            color: white;
        }
        
        .download-btn:hover {
            background: rgba(34, 197, 94, 1);
        }
        
        .pagination {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 30px;
        }
        
        .page-btn {
            padding: 10px 15px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            color: rgba(255, 255, 255, 0.8);
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .page-btn:hover,
        .page-btn.active {
            background: rgba(59, 130, 246, 0.8);
            color: white;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: rgba(255, 255, 255, 0.8);
        }
        
        .loading i {
            font-size: 2rem;
            margin-bottom: 15px;
        }
        
        /* Enhanced application row styling */
        .application-row[data-priority="high"] {
            border-left: 3px solid #f59e0b;
        }
        
        .bg-check-badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 500;
        }
        
        .bg-check-pending {
            background: rgba(156, 163, 175, 0.2);
            color: #9ca3af;
        }
        
        .bg-check-in_progress {
            background: rgba(59, 130, 246, 0.2);
            color: #3b82f6;
        }
        
        .bg-check-completed,
        .bg-check-clear {
            background: rgba(34, 197, 94, 0.2);
            color: #22c55e;
        }
        
        .action-dropdown {
            position: relative;
        }
        
        .dropdown-menu {
            position: absolute;
            top: 100%;
            right: 0;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            padding: 8px;
            min-width: 150px;
            z-index: 100;
        }
        
        .dropdown-menu button {
            display: block;
            width: 100%;
            padding: 8px 12px;
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.9);
            text-align: left;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.85rem;
            margin-bottom: 2px;
            transition: background 0.2s ease;
        }
        
        .dropdown-menu button:hover {
            background: rgba(255, 255, 255, 0.1);
        }
        
        .applicant-details {
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.6);
            margin-top: 3px;
        }
        
        .position-location {
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.6);
        }
        
        .experience-info {
            color: rgba(255, 255, 255, 0.9);
        }
        
        .status-info {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }
        
        /* Enhanced table layout */
        .table-header,
        .application-row {
            grid-template-columns: 2fr 1.5fr 1fr 1fr 1.2fr 1fr;
        }
        
        /* Security clearance indicator */
        .clearance-indicator {
            color: #10b981;
            font-weight: 500;
        }
        
        /* Sensitive data highlighting */
        .sensitive-data {
            color: #fbbf24;
            font-weight: 500;
        }
        
        /* Priority star */
        .priority-star {
            color: #f59e0b;
            margin-left: 5px;
        }
        
        @media (max-width: 768px) {
            .admin-container {
                padding: 20px;
                margin: 10px;
            }
            
            .table-header,
            .application-row {
                grid-template-columns: 1fr;
                gap: 10px;
            }
            
            .filters {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="header">
        <nav class="navbar">
            <div class="nav-container">
                <div class="nav-logo">
                    <img src="img/blue-mountain-bank.png" alt="Blue Mountain Bank Logo" class="header-logo">
                    <span>Blue Mountain Bank - Admin</span>
                </div>
                <div class="nav-menu">
                    <a href="admin.html" class="nav-link">Dashboard</a>
                    <a href="job-applications-admin.html" class="nav-link active">Applications</a>
                    <a href="index.html" class="nav-link">Public Site</a>
                </div>
            </div>
        </nav>
    </header>

    <!-- Main Content -->
    <main class="admin-main">
        <div class="container">
            <div class="admin-container">
                <div class="admin-header">
                    <h1><i class="fas fa-briefcase"></i> Job Applications</h1>
                    <button class="action-btn download-btn" onclick="exportApplications()">
                        <i class="fas fa-download"></i> Export All
                    </button>
                </div>
                
                <!-- Statistics -->
                <div class="admin-stats">
                    <div class="stat-card">
                        <h3 id="totalApplications">0</h3>
                        <p>Total Applications</p>
                    </div>
                    <div class="stat-card">
                        <h3 id="newApplications">0</h3>
                        <p>New Applications</p>
                    </div>
                    <div class="stat-card">
                        <h3 id="interviewScheduled">0</h3>
                        <p>Interview Scheduled</p>
                    </div>
                    <div class="stat-card">
                        <h3 id="thisWeekApplications">0</h3>
                        <p>This Week</p>
                    </div>
                </div>

                <!-- Filters -->
                <div class="filters">
                    <div class="filter-group">
                        <label for="statusFilter">Status</label>
                        <select id="statusFilter" onchange="filterApplications()">
                            <option value="">All Statuses</option>
                            <option value="new">New</option>
                            <option value="reviewed">Reviewed</option>
                            <option value="interview">Interview</option>
                            <option value="hired">Hired</option>
                            <option value="rejected">Rejected</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label for="departmentFilter">Department</label>
                        <select id="departmentFilter" onchange="filterApplications()">
                            <option value="">All Departments</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label for="positionFilter">Position</label>
                        <select id="positionFilter" onchange="filterApplications()">
                            <option value="">All Positions</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label for="searchFilter">Search</label>
                        <input type="text" id="searchFilter" placeholder="Name, email, or ID..." onkeyup="filterApplications()">
                    </div>
                    <div class="filter-group">
                        <label for="priorityFilter">Priority</label>
                        <select id="priorityFilter" onchange="filterApplications()">
                            <option value="">All Priorities</option>
                            <option value="high">High Priority</option>
                            <option value="medium">Medium Priority</option>
                            <option value="low">Low Priority</option>
                        </select>
                    </div>
                </div>

                <!-- Applications Table -->
                <div class="applications-table">
                    <div class="table-header">
                        <div>Applicant</div>
                        <div>Position</div>
                        <div>Applied Date</div>
                        <div>Experience</div>
                        <div>Status & Checks</div>
                        <div>Actions</div>
                    </div>
                    
                    <div id="applicationsContainer">
                        <div class="loading">
                            <i class="fas fa-spinner fa-spin"></i>
                            <p>Loading applications...</p>
                        </div>
                    </div>
                </div>

                <!-- Pagination -->
                <div class="pagination" id="pagination"></div>
            </div>
        </div>
    </main>

    <script src="js/job-applications-data-service.js"></script>
    <script src="js/job-applications-admin.js"></script>
</body>
</html>
