<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Banking Login - Blue Mountain Bank</title>
    <!-- CDN Helper Script -->
    <script src="js/cdn-helper.js"></script>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/login.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="login-page">
        <a href="index.html" class="back-to-home">
            <i class="fas fa-arrow-left"></i>
            Back to Home
        </a>
        
        <div class="login-container">
            <div class="login-header">
                <div class="login-logo">
                    <img src="img/blue-mountain-bank.png" alt="Blue Mountain Bank Logo">
                </div>
                <h1 class="login-title">Online Banking</h1>
                <p class="login-subtitle">Secure access to your accounts</p>
            </div>

            <form class="login-form" id="loginForm">
                <div class="form-group">
                    <input type="text" id="username" name="username" placeholder="Username or Email" required>
                    <i class="fas fa-user input-icon"></i>
                </div>
                
                <div class="form-group">
                    <input type="password" id="password" name="password" placeholder="Password" required>
                    <i class="fas fa-eye password-toggle input-icon" id="passwordToggle"></i>
                </div>

                <div class="login-options">
                    <label class="remember-me">
                        <input type="checkbox" id="rememberMe">
                        Remember me
                    </label>
                    <a href="#" class="forgot-password">Forgot Password?</a>
                </div>

                <button type="submit" class="login-btn">
                    <i class="fas fa-lock"></i>
                    Secure Login
                </button>
                
                <!-- Hidden developer mode toggle (press Ctrl+D+E+V) -->
                <div id="devMode" style="display: none; margin-top: 15px; padding: 10px; background: #f8f9fa; border-radius: 5px; border: 1px solid #ddd;">
                    <h5 style="margin: 0 0 10px 0; color: #666;">🔧 Developer Mode</h5>
                    <button type="button" onclick="quickLogin('alice')" style="margin: 5px; padding: 8px 12px; background: #28a745; color: white; border: none; border-radius: 3px; cursor: pointer;">Login as Alice</button>
                    <button type="button" onclick="quickLogin('bob')" style="margin: 5px; padding: 8px 12px; background: #007bff; color: white; border: none; border-radius: 3px; cursor: pointer;">Login as Bob</button>
                    <button type="button" onclick="goToDirect()" style="margin: 5px; padding: 8px 12px; background: #6c757d; color: white; border: none; border-radius: 3px; cursor: pointer;">Direct Access</button>
                </div>
            </form>

            <div class="security-info">
                <h4>
                    <i class="fas fa-shield-alt"></i>
                    Your Security is Our Priority
                </h4>
                <p>We use bank-level encryption and multi-factor authentication to protect your financial information. Never share your login credentials with anyone.</p>
            </div>
        </div>
    </div>

    <script src="js/local-storage-manager.js?v=2.0"></script>
    <script src="js/azure-proxy.js?v=2.0"></script>
    <script src="js/azure-storage-manager.js?v=2.0"></script>
    <script src="js/script.js?v=2.0"></script>
    <script src="js/login.js?v=2.0"></script>
    
    <script>
        // Check for message and redirect parameters when page loads
        document.addEventListener('DOMContentLoaded', function() {
            const urlParams = new URLSearchParams(window.location.search);
            const message = urlParams.get('message');
            
            // Display error message if present in URL
            if (message) {
                showLoginError(message);
            }
            
            // Store redirect parameter for post-login redirect
            const redirect = urlParams.get('redirect');
            if (redirect) {
                console.log('Storing redirect URL for after login:', redirect);
                sessionStorage.setItem('loginRedirect', redirect);
                
                // Check if this is an admin page and set a visual indicator
                if (redirect.includes('/admin') || redirect === 'admin.html') {
                    document.querySelector('.login-title').textContent = 'Admin Login';
                    document.querySelector('.login-subtitle').textContent = 'Secure access to admin panel';
                }
            }
            
            // Check if we're already logged in as admin (and no forced logout)
            if (!urlParams.get('logout')) {
                const adminSession = sessionStorage.getItem('adminSession');
                const adminExpiry = sessionStorage.getItem('adminSessionExpiry');
                
                if (adminSession === 'true' && adminExpiry && new Date(adminExpiry) > new Date()) {
                    console.log('Already logged in as admin, redirecting to admin page');
                    // Reset session expiry
                    sessionStorage.setItem('adminSessionExpiry', new Date(Date.now() + 30 * 60 * 1000).toISOString());
                    // Redirect to requested page or admin dashboard
                    const redirectUrl = redirect || 'admin.html';
                    window.location.replace(redirectUrl);
                }
            }
        });
        
        // Developer mode activation (Ctrl+D+E+V sequence)
        let devSequence = '';
        document.addEventListener('keydown', function(e) {
            if (e.ctrlKey) {
                devSequence += e.key.toLowerCase();
                if (devSequence.includes('dev')) {
                    document.getElementById('devMode').style.display = 'block';
                    console.log('Developer mode activated');
                    devSequence = '';
                }
                setTimeout(() => { devSequence = ''; }, 2000);
            }
        });
        
        // Quick login functions for developer mode
        window.quickLogin = function(user) {
            const userCredentials = {
                alice: { username: 'alice.martinez', password: 'AliceSecure2025!' },
                bob: { username: 'bob.johnson', password: 'BobPass2025!' }
            };
            
            if (userCredentials[user]) {
                document.getElementById('username').value = userCredentials[user].username;
                document.getElementById('password').value = userCredentials[user].password;
                // Trigger login
                document.getElementById('loginForm').dispatchEvent(new Event('submit'));
            }
        };
        
        window.goToDirect = function() {
            window.location.href = 'direct-access.html';
        };
    </script>
</body>
</html>
