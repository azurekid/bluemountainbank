<!DOCTYPE html>
<html>
<head>
    <title>Error Debug - Blue Mountain Bank</title>
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/header.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            margin: 0; 
            background: linear-gradient(135deg, rgba(30, 64, 175, 0.6) 0%, rgba(59, 130, 246, 0.5) 50%, rgba(96, 165, 250, 0.4) 100%);
            min-height: 100vh;
            color: #ffffff;
            padding: 20px 0;
        }
        .container { 
            max-width: 800px; 
            margin: 0 auto; 
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            padding: 40px; 
            border-radius: 20px; 
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.15), 0 0 0 1px rgba(255, 255, 255, 0.1);
        }
        .error { 
            background: rgba(239, 68, 68, 0.15);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-left: 4px solid #ef4444;
            padding: 20px; 
            border-radius: 12px; 
            margin: 20px 0;
            color: #ffffff;
            box-shadow: 0 4px 15px rgba(239, 68, 68, 0.1);
        }
        .success { 
            background: rgba(5, 150, 105, 0.15);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(5, 150, 105, 0.3);
            border-left: 4px solid #10b981;
            padding: 20px; 
            border-radius: 12px; 
            margin: 20px 0;
            color: #ffffff;
            box-shadow: 0 4px 15px rgba(5, 150, 105, 0.1);
        }
        .info { 
            background: rgba(30, 64, 175, 0.15);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(30, 64, 175, 0.3);
            border-left: 4px solid #3b82f6;
            padding: 20px; 
            border-radius: 12px; 
            margin: 20px 0;
            color: #ffffff;
            box-shadow: 0 4px 15px rgba(30, 64, 175, 0.1);
        }
        pre { 
            background: rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 20px; 
            overflow-x: auto; 
            white-space: pre-wrap; 
            border-radius: 10px;
            color: #ffffff;
            font-family: 'Inter', monospace;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
        }
        button { 
            margin: 8px; 
            padding: 12px 24px; 
            cursor: pointer; 
            background: rgba(59, 130, 246, 0.8);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            font-weight: 500;
            transition: all 0.3s ease;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
        }
        button:hover {
            background: rgba(59, 130, 246, 1);
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.3);
        }
        h1, h2, h3 {
            color: #ffffff;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
            margin-bottom: 20px;
        }
        
        h1 {
            text-align: center;
            font-size: 2.2rem;
            font-weight: 700;
            margin-bottom: 30px;
        }
        
        h1 i {
            color: rgba(255, 255, 255, 0.9);
            margin-right: 15px;
        }
        
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: #ffffff;
            text-decoration: none;
            font-weight: 500;
            margin-bottom: 30px;
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 8px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1), inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }
        
        .back-link:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateX(-3px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15), inset 0 1px 0 rgba(255, 255, 255, 0.15);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔧 Blue Mountain Bank - Error Diagnostics</h1>
        
        <div class="info">
            <h3>What is this page?</h3>
            <p>This page helps diagnose JavaScript errors and connectivity issues with the Blue Mountain Bank application.</p>
        </div>

        <div class="error" id="errorInfo" style="display: none;">
            <h3>⚠️ Error Detected</h3>
            <div id="errorDetails"></div>
        </div>

        <h2>System Diagnostics</h2>
        <button onclick="runDiagnostics()">Run Full Diagnostics</button>
        <button onclick="testBasicJS()">Test Basic JavaScript</button>
        <button onclick="testStorageManager()">Test Storage Manager</button>
        <button onclick="testDataSource()">Test Data Source</button>
        <button onclick="clearStorage()">Clear Session Storage</button>
        
        <div id="diagnosticsResults"></div>

        <h2>Manual Test</h2>
        <div style="margin: 20px 0;">
            <input type="text" id="testUsername" placeholder="Username" value="alice.martinez" style="margin: 5px; padding: 8px;">
            <input type="password" id="testPassword" placeholder="Password" value="AliceM2024!" style="margin: 5px; padding: 8px;">
            <button onclick="testLogin()">Test Login</button>
        </div>
        <div id="loginResults"></div>

        <a href="../login.html" class="back-link">← Back to Login</a>
    </div>

    <script>
        // Global error handler
        window.addEventListener('error', function(event) {
            console.error('Global error caught:', event.error);
            showError('JavaScript Error', event.error.message + '\n\nFile: ' + event.filename + '\nLine: ' + event.lineno);
        });

        function showError(title, details) {
            const errorInfo = document.getElementById('errorInfo');
            const errorDetails = document.getElementById('errorDetails');
            errorDetails.innerHTML = `<h4>${title}</h4><pre>${details}</pre>`;
            errorInfo.style.display = 'block';
        }

        function addResult(message, type = 'info') {
            const results = document.getElementById('diagnosticsResults');
            const div = document.createElement('div');
            div.className = type;
            div.innerHTML = message;
            results.appendChild(div);
        }

        function testBasicJS() {
            const results = document.getElementById('diagnosticsResults');
            results.innerHTML = '';
            
            try {
                addResult('✅ JavaScript is working', 'success');
                addResult(`✅ Date: ${new Date().toISOString()}`, 'success');
                addResult(`✅ User Agent: ${navigator.userAgent}`, 'info');
                addResult(`✅ Location: ${window.location.href}`, 'info');
            } catch (error) {
                addResult(`❌ Basic JavaScript test failed: ${error.message}`, 'error');
            }
        }

        function testStorageManager() {
            const results = document.getElementById('diagnosticsResults');
            
            try {
                // Test if script is loaded
                if (typeof AzureStorageManager === 'undefined') {
                    addResult('❌ AzureStorageManager not found - script not loaded', 'error');
                    return;
                }
                
                addResult('✅ AzureStorageManager class is available', 'success');
                
                // Try to create instance
                const manager = new AzureStorageManager();
                addResult('✅ AzureStorageManager instance created', 'success');
                addResult(`✅ Storage Account: ${manager.storageAccount}`, 'info');
                addResult(`✅ Container: ${manager.containerName}`, 'info');
                addResult(`✅ Local users available: ${Object.keys(manager.localUsers).length}`, 'info');
                
            } catch (error) {
                addResult(`❌ Storage Manager test failed: ${error.message}`, 'error');
                console.error('Storage Manager error:', error);
            }
        }

        async function testDataSource() {
            const results = document.getElementById('diagnosticsResults');
            
            try {
                if (typeof AzureStorageManager === 'undefined') {
                    addResult('❌ AzureStorageManager not available', 'error');
                    return;
                }
                
                const manager = new AzureStorageManager();
                await manager.initialize();
                
                addResult('📊 <strong>DATA SOURCE TEST</strong>', 'info');
                addResult(`Initial fallback mode: ${manager.useLocalFallback ? 'LOCAL' : 'AZURE'}`, 'info');
                
                // Test Azure connectivity
                const testUrl = `${manager.baseUrl}?restype=container&comp=list&prefix=users/&${manager.sasToken}`;
                addResult(`Testing Azure URL: ${testUrl.substring(0, 80)}...`, 'info');
                
                try {
                    const response = await fetch(testUrl);
                    if (response.ok) {
                        const xmlText = await response.text();
                        const parser = new DOMParser();
                        const xmlDoc = parser.parseFromString(xmlText, 'text/xml');
                        const blobs = xmlDoc.getElementsByTagName('Blob');
                        
                        addResult(`✅ Azure connection successful - Found ${blobs.length} user files`, 'success');
                        addResult(`🔵 <strong>DATA SOURCE: AZURE BLOB STORAGE</strong>`, 'success');
                        
                        if (blobs.length > 0) {
                            addResult('Azure user files:', 'info');
                            for (let blob of blobs) {
                                const name = blob.getElementsByTagName('Name')[0].textContent;
                                addResult(`  - ${name}`, 'info');
                            }
                        }
                    } else {
                        addResult(`❌ Azure connection failed: ${response.status} ${response.statusText}`, 'error');
                        addResult(`🟠 <strong>DATA SOURCE: LOCAL JAVASCRIPT FALLBACK</strong>`, 'error');
                    }
                } catch (networkError) {
                    addResult(`❌ Azure network error: ${networkError.message}`, 'error');
                    addResult(`🟠 <strong>DATA SOURCE: LOCAL JAVASCRIPT FALLBACK</strong>`, 'error');
                }
                
                // Show local fallback data
                addResult(`Local fallback users: ${Object.keys(manager.localUsers).join(', ')}`, 'info');
                
                // Test user data loading
                const testUserId = 'alice_martinez';
                const userData = await manager.getUserData(testUserId);
                if (userData) {
                    const transactions = userData.transactions || userData.recentTransactions || [];
                    const dataSource = manager.useLocalFallback ? 'LOCAL JS' : 'AZURE';
                    addResult(`✅ User data loaded from ${dataSource} - ${transactions.length} transactions`, 'success');
                } else {
                    addResult(`❌ Failed to load user data for ${testUserId}`, 'error');
                }
                
            } catch (error) {
                addResult(`❌ Data source test failed: ${error.message}`, 'error');
                console.error('Data source error:', error);
            }
        }

        async function testLogin() {
            const results = document.getElementById('loginResults');
            results.innerHTML = '';
            
            const username = document.getElementById('testUsername').value;
            const password = document.getElementById('testPassword').value;
            
            try {
                results.innerHTML = '<div class="info">Testing login...</div>';
                
                if (typeof AzureStorageManager === 'undefined') {
                    throw new Error('AzureStorageManager not loaded');
                }
                
                const manager = new AzureStorageManager();
                await manager.initialize();
                
                // Show initial state
                results.innerHTML += `<div class="info">Initial fallback mode: ${manager.useLocalFallback ? 'LOCAL' : 'AZURE'}</div>`;
                
                const authResult = await manager.authenticateUser(username, password);
                
                // Show final state and data source
                const dataSource = manager.useLocalFallback ? 'LOCAL JAVASCRIPT' : 'AZURE BLOB STORAGE';
                const sourceColor = manager.useLocalFallback ? '#ff9800' : '#2196f3';
                
                if (authResult.success) {
                    results.innerHTML += `<div class="success">✅ Login successful!<br>
                        <strong>User ID:</strong> ${authResult.userId}<br>
                        <strong style="color: ${sourceColor};">DATA SOURCE: ${dataSource}</strong><br>
                        <strong>Has Transactions:</strong> ${(authResult.user.transactions || authResult.user.recentTransactions || []).length > 0 ? 'YES' : 'NO'}<br>
                        <strong>Transaction Count:</strong> ${(authResult.user.transactions || authResult.user.recentTransactions || []).length}
                    </div>`;
                    
                    // Show detailed data source info
                    results.innerHTML += `<div class="info">
                        <h4>Data Source Details:</h4>
                        <pre>Fallback Mode: ${manager.useLocalFallback}
Storage Account: ${manager.storageAccount}
Container: ${manager.containerName}
Local Users Available: ${Object.keys(manager.localUsers).length}</pre>
                    </div>`;
                } else {
                    results.innerHTML += `<div class="error">❌ Login failed: ${authResult.message}<br>
                        <strong style="color: ${sourceColor};">DATA SOURCE: ${dataSource}</strong>
                    </div>`;
                }
                
            } catch (error) {
                results.innerHTML += `<div class="error">❌ Login test error: ${error.message}<br><pre>${error.stack}</pre></div>`;
                console.error('Login test error:', error);
            }
        }

        function clearStorage() {
            sessionStorage.clear();
            localStorage.clear();
            addResult('✅ Storage cleared', 'success');
        }

        async function runDiagnostics() {
            const results = document.getElementById('diagnosticsResults');
            results.innerHTML = '<div class="info">Running diagnostics...</div>';
            
            testBasicJS();
            testStorageManager();
            
            // Test network connectivity
            try {
                const response = await fetch('js/azure-storage-manager.js', { method: 'HEAD' });
                if (response.ok) {
                    addResult('✅ Network connectivity OK', 'success');
                } else {
                    addResult(`❌ Network issue: ${response.status}`, 'error');
                }
            } catch (error) {
                addResult(`❌ Network error: ${error.message}`, 'error');
            }
        }

        // Auto-run basic diagnostics on load
        window.addEventListener('load', () => {
            setTimeout(runDiagnostics, 100);
        });
    </script>

    <!-- Load the storage manager script -->
    <script src="../js/azure-storage-manager.js" onerror="showError('Script Load Error', 'Failed to load azure-storage-manager.js')"></script>
</body>
</html>
