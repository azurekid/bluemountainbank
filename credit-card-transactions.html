    <!-- User authentication check script -->
    <script>
        // Immediately check if user is logged in
        (function() {
            const currentUser = sessionStorage.getItem('currentUser');
            const loginTime = sessionStorage.getItem('loginTime');
            
            if (!currentUser || !loginTime) {
                console.log('User not logged in - redirecting to login page');
                window.location.replace('login.html?redirect=' + encodeURIComponent(window.location.pathname));
                return;
            }
            
            // Optional: Check if session has expired (e.g., after 2 hours)
            const sessionAge = new Date() - new Date(loginTime);
            if (sessionAge > 7200000) { // 2 hours in milliseconds
                console.log('User session expired');
                sessionStorage.removeItem('currentUser');
                sessionStorage.removeItem('loginTime');
                sessionStorage.removeItem('userRole');
                window.location.replace('login.html?redirect=' + encodeURIComponent(window.location.pathname) + 
                    '&message=' + encodeURIComponent('Your session has expired. Please log in again.'));
                return;
            }
        })();
    </script>

    <script>
        // Initialize page header and user info
        async function initializePageHeader() {
            const currentUserId = sessionStorage.getItem('currentUser');
            if (!currentUserId) {
                window.location.href = 'login.html';
                return;
            }

            try {
                // Initialize storage
                const storageFactory = new StorageFactory();
                const storageManager = await storageFactory.getStorageManager();
                
                // Load user data
                const userData = await storageManager.getUserData(currentUserId);
                if (!userData) {
                    throw new Error('User data not found');
                }

                // Update header
                document.getElementById('userAvatar').textContent = userData.profile.avatar;
                document.getElementById('userName').textContent = userData.profile.fullName;
                document.getElementById('userAccount').textContent = `Account ${userData.profile.accountNumber}`;
                
                // Apply theme
                const preferences = userData.preferences || {};
                const theme = preferences.theme || 'light';
                const darkMode = preferences.darkMode || false;

                if (theme === 'dark' || darkMode) {
                    document.body.classList.add('dark-mode');
                    document.body.setAttribute('data-theme', 'dark');
                } else {
                    document.body.classList.remove('dark-mode');
                    document.body.setAttribute('data-theme', 'light');
                }

                // Hide loading screen
                setTimeout(() => {
                    const loadingScreen = document.getElementById('loadingScreen');
                    if (loadingScreen) {
                        loadingScreen.classList.add('hidden');
                        setTimeout(() => {
                            loadingScreen.style.display = 'none';
                        }, 500);
                    }
                }, 800);

            } catch (error) {
                console.error('Error initializing header:', error);
                alert('Failed to load user data. Please try logging in again.');
                window.location.href = 'login.html';
            }
        }

        class CreditCardTransactions {
            constructor() {
                this.currentUser = null;
                this.storageManager = null;
                this.init();
            }

            async init() {
                const currentUserId = sessionStorage.getItem('currentUser');
                if (!currentUserId) {
                    window.location.href = 'login.html';
                    return;
                }

                try {
                    const storageFactory = new StorageFactory();
                    this.storageManager = await storageFactory.getStorageManager();
                    
                    this.currentUser = await this.storageManager.getUserData(currentUserId);
                    
                    if (!this.currentUser) {
                        alert('User data not found. Redirecting to login.');
                        window.location.href = 'login.html';
                        return;
                    }                this.loadCreditCardGrids();
                this.loadQuickActionsSidebar();
                this.applyUserTheme();
                } catch (error) {
                    console.error('Error initializing credit card transactions:', error);
                    alert('Failed to load credit card data. Please try again.');
                }
            }

            applyUserTheme() {
                // Check user preferences for theme
                const preferences = this.currentUser.preferences || {};
                const theme = preferences.theme || 'light';
                const darkMode = preferences.darkMode || false;

                // Apply dark mode if enabled
                if (theme === 'dark' || darkMode) {
                    document.body.classList.add('dark-mode');
                    document.body.setAttribute('data-theme', 'dark');
                } else {
                    document.body.classList.remove('dark-mode');
                    document.body.setAttribute('data-theme', 'light');
                }
            }

            loadCreditCardGrids() {
                const container = document.getElementById('creditCardsContainer');
                container.innerHTML = '';

                const creditCards = this.currentUser.personalInfo?.creditCards || {};
                
                if (Object.keys(creditCards).length === 0) {
                    container.innerHTML = `
                        <div class="no-transactions">
                            <i class="fas fa-credit-card"></i>
                            <div>No credit cards found</div>
                        </div>
                    `;
                    return;
                }

                // Create a separate grid for each credit card
                Object.entries(creditCards).forEach(([cardId, cardData]) => {
                    const cardGrid = this.createCreditCardGrid(cardId, cardData);
                    container.appendChild(cardGrid);
                });
            }

            loadQuickActionsSidebar() {
                this.loadCardSummaryStats();
                this.loadRecentActivity();
            }

            loadCardSummaryStats() {
                const container = document.getElementById('cardSummaryStats');
                const creditCards = this.currentUser.personalInfo?.creditCards || {};
                
                let totalBalance = 0;
                let totalLimit = 0;
                let totalTransactions = 0;
                let activeCards = 0;
                
                Object.values(creditCards).forEach(card => {
                    totalBalance += Math.abs(card.balance || 0);
                    totalLimit += card.limit || 0;
                    totalTransactions += (card.transactions || []).length;
                    if (card.isActive !== false) activeCards++;
                });
                
                const utilizationRate = totalLimit > 0 ? (totalBalance / totalLimit * 100).toFixed(1) : 0;
                
                container.innerHTML = `
                    <div class="stat-item">
                        <span class="stat-label">Total Balance</span>
                        <span class="stat-value">${this.formatCurrency(totalBalance)}</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">Available Credit</span>
                        <span class="stat-value positive">${this.formatCurrency(totalLimit - totalBalance)}</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">Credit Utilization</span>
                        <span class="stat-value ${utilizationRate > 30 ? 'negative' : 'positive'}">${utilizationRate}%</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">Active Cards</span>
                        <span class="stat-value">${activeCards}</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">Total Transactions</span>
                        <span class="stat-value">${totalTransactions}</span>
                    </div>
                `;
            }

            loadRecentActivity() {
                const container = document.getElementById('recentActivityList');
                const creditCards = this.currentUser.personalInfo?.creditCards || {};
                
                // Collect all transactions from all cards
                let allTransactions = [];
                Object.entries(creditCards).forEach(([cardId, card]) => {
                    if (card.transactions) {
                        card.transactions.forEach(transaction => {
                            allTransactions.push({
                                ...transaction,
                                cardId,
                                cardName: card.name || card.type || 'Credit Card'
                            });
                        });
                    }
                });
                
                // Sort by date (newest first) and take top 5
                const recentTransactions = allTransactions
                    .sort((a, b) => new Date(b.date) - new Date(a.date))
                    .slice(0, 5);
                
                if (recentTransactions.length === 0) {
                    container.innerHTML = `
                        <div class="activity-item">
                            <div class="activity-icon">
                                <i class="fas fa-info-circle"></i>
                            </div>
                            <div class="activity-details">
                                <div class="activity-description">No recent activity</div>
                                <div class="activity-time">--</div>
                            </div>
                        </div>
                    `;
                    return;
                }
                
                let activityHTML = '';
                recentTransactions.forEach(transaction => {
                    const timeAgo = this.getTimeAgo(transaction.date);
                    const icon = this.getTransactionIcon(transaction.category, transaction.type);
                    const amountClass = transaction.amount >= 0 ? 'positive' : 'negative';
                    const amountText = `${transaction.amount >= 0 ? '+' : ''}${this.formatCurrency(Math.abs(transaction.amount))}`;
                    
                    activityHTML += `
                        <div class="activity-item">
                            <div class="activity-icon">
                                <i class="${icon}"></i>
                            </div>
                            <div class="activity-details">
                                <div class="activity-description">${transaction.description}</div>
                                <div class="activity-time">${timeAgo}</div>
                            </div>
                            <div class="activity-amount ${amountClass}">${amountText}</div>
                        </div>
                    `;
                });
                
                container.innerHTML = activityHTML;
            }

            getTimeAgo(dateString) {
                const now = new Date();
                const date = new Date(dateString);
                const diffInHours = Math.floor((now - date) / (1000 * 60 * 60));
                
                if (diffInHours < 1) return 'Just now';
                if (diffInHours < 24) return `${diffInHours}h ago`;
                
                const diffInDays = Math.floor(diffInHours / 24);
                if (diffInDays < 7) return `${diffInDays}d ago`;
                
                const diffInWeeks = Math.floor(diffInDays / 7);
                if (diffInWeeks < 4) return `${diffInWeeks}w ago`;
                
                const diffInMonths = Math.floor(diffInDays / 30);
                return `${diffInMonths}mo ago`;
            }

            // Quick Action Methods
            showPaymentModal() {
                alert('Payment feature would open here - redirect to payment page or show modal');
            }

            showBalanceTransfer() {
                alert('Balance transfer feature would open here');
            }

            showCreditLimitInfo() {
                alert('Credit limit information would be displayed here');
            }

            showFreezeCard() {
                if (confirm('Are you sure you want to freeze your credit card?')) {
                    alert('Card freeze feature would be implemented here');
                }
            }

            downloadStatement() {
                alert('Statement download would be implemented here');
            }

            showAutoPay() {
                alert('Auto-pay setup would open here');
            }

            showRewards() {
                alert('Rewards information would be displayed here');
            }

            showCardSettings() {
                alert('Card settings would open here');
            }

            createCreditCardGrid(cardId, cardData) {
                const gridDiv = document.createElement('div');
                gridDiv.className = 'credit-card-grid';
                gridDiv.id = `credit-card-${cardId}`;
                
                const maskedNumber = this.maskCreditCard(cardData.number);
                const balance = cardData.balance || 0;
                const transactions = cardData.transactions || [];
                const isActive = cardData.isActive !== false;
                
                gridDiv.innerHTML = `
                    <div class="credit-card-header">
                        <div class="credit-card-title">
                            <i class="fas fa-credit-card credit-card-icon"></i>
                            <div>
                                <div>${cardData.name || cardData.type || 'Credit Card'}</div>
                                <div class="card-number">${maskedNumber}</div>
                            </div>
                        </div>
                        <div class="credit-card-details">
                            <div class="card-balance ${balance >= 0 ? 'positive' : 'negative'}">
                                ${this.formatCurrency(Math.abs(balance))}
                            </div>
                            <div class="card-status ${isActive ? 'active' : 'inactive'}">
                                ${isActive ? 'Active' : 'Inactive'}
                            </div>
                        </div>
                    </div>
                    
                    <div class="transactions-section">
                        <div class="transactions-header">
                            <div class="transactions-title">
                                <i class="fas fa-list"></i>
                                Transactions
                                <span class="transaction-count">${transactions.length}</span>
                            </div>
                        </div>
                        
                        <div class="transactions-filters">
                            <select class="filter-select" id="categoryFilter_${cardId}">
                                <option value="">All Categories</option>
                                <option value="purchase">Purchases</option>
                                <option value="payment">Payments</option>
                                <option value="restaurants">Restaurants</option>
                                <option value="gas">Gas</option>
                                <option value="groceries">Groceries</option>
                                <option value="shopping">Shopping</option>
                                <option value="hotels">Hotels</option>
                                <option value="airlines">Airlines</option>
                                <option value="entertainment">Entertainment</option>
                                <option value="utilities">Utilities</option>
                            </select>
                            
                            <input type="date" class="filter-input" id="dateFilter_${cardId}" 
                                   placeholder="Filter by date">
                            
                            <button class="filter-btn" onclick="creditCardTransactions.filterTransactions('${cardId}')">
                                <i class="fas fa-filter"></i>
                                Apply Filters
                            </button>
                            
                            <button class="filter-btn" onclick="creditCardTransactions.clearFilters('${cardId}')">
                                <i class="fas fa-times"></i>
                                Clear
                            </button>
                        </div>
                        
                        <div class="transactions-grid" id="transactionsGrid_${cardId}">
                            ${this.createTransactionsGrid(transactions)}
                        </div>
                    </div>
                `;
                
                return gridDiv;
            }

            createTransactionsGrid(transactions) {
                if (transactions.length === 0) {
                    return `
                        <div class="no-transactions">
                            <i class="fas fa-receipt"></i>
                            <div>No transactions found</div>
                        </div>
                    `;
                }

                // Sort transactions by date (newest first)
                const sortedTransactions = [...transactions].sort((a, b) => 
                    new Date(b.date) - new Date(a.date)
                );

                let gridHTML = '';

                sortedTransactions.forEach(transaction => {
                    const date = new Date(transaction.date).toLocaleDateString('en-US', {
                        year: 'numeric',
                        month: 'short',
                        day: 'numeric'
                    });
                    
                    const amount = transaction.amount;
                    const amountClass = amount >= 0 ? 'positive' : 'negative';
                    const amountText = `${amount >= 0 ? '+' : ''}${this.formatCurrency(Math.abs(amount))}`;
                    const transactionIcon = this.getTransactionIcon(transaction.category, transaction.type);
                    
                    gridHTML += `
                        <div class="transaction-item">
                            <div class="transaction-info">
                                <div class="transaction-icon">
                                    <i class="${transactionIcon}"></i>
                                </div>
                                <div class="transaction-details">
                                    <div class="transaction-description">${transaction.description}</div>
                                    <div class="transaction-meta">
                                        <span class="transaction-category category-${transaction.category}">
                                            ${transaction.category}
                                        </span>
                                        <span>${this.capitalizeFirst(transaction.type)}</span>
                                    </div>
                                </div>
                            </div>
                            <div class="transaction-amount">
                                <div class="amount-value ${amountClass}">${amountText}</div>
                                <div class="transaction-date">${date}</div>
                            </div>
                        </div>
                    `;
                });

                return gridHTML;
            }

            filterTransactions(cardId) {
                const categoryFilter = document.getElementById(`categoryFilter_${cardId}`).value;
                const dateFilter = document.getElementById(`dateFilter_${cardId}`).value;
                
                const cardData = this.currentUser.personalInfo.creditCards[cardId];
                let filteredTransactions = [...(cardData.transactions || [])];

                // Apply category filter
                if (categoryFilter) {
                    filteredTransactions = filteredTransactions.filter(t => 
                        t.category === categoryFilter
                    );
                }

                // Apply date filter
                if (dateFilter) {
                    filteredTransactions = filteredTransactions.filter(t => 
                        t.date === dateFilter
                    );
                }

                const container = document.getElementById(`transactionsGrid_${cardId}`);
                container.innerHTML = this.createTransactionsGrid(filteredTransactions);
            }

            clearFilters(cardId) {
                // Clear filter inputs
                document.getElementById(`categoryFilter_${cardId}`).value = '';
                document.getElementById(`dateFilter_${cardId}`).value = '';
                
                // Reset transactions display
                const cardData = this.currentUser.personalInfo.creditCards[cardId];
                const container = document.getElementById(`transactionsGrid_${cardId}`);
                container.innerHTML = this.createTransactionsGrid(cardData.transactions || []);
            }

            getTransactionIcon(category, type) {
                // Payment transactions get a special icon
                if (type === 'payment') {
                    return 'fas fa-check-circle';
                }

                // Category-specific icons
                const categoryIcons = {
                    'restaurants': 'fas fa-utensils',
                    'gas': 'fas fa-gas-pump',
                    'groceries': 'fas fa-shopping-cart',
                    'shopping': 'fas fa-shopping-bag',
                    'hotels': 'fas fa-bed',
                    'airlines': 'fas fa-plane',
                    'entertainment': 'fas fa-tv',
                    'utilities': 'fas fa-bolt',
                    'purchase': 'fas fa-credit-card',
                    'payment': 'fas fa-check-circle'
                };

                return categoryIcons[category.toLowerCase()] || 'fas fa-circle';
            }

            maskCreditCard(cardNumber) {
                if (!cardNumber) return '**** **** **** ****';
                const clean = cardNumber.replace(/\D/g, '');
                if (clean.length >= 13) {
                    const lastFour = clean.substring(clean.length - 4);
                    return `**** **** **** ${lastFour}`;
                }
                return '**** **** **** ****';
            }

            formatCurrency(amount) {
                return new Intl.NumberFormat('en-US', {
                    style: 'currency',
                    currency: 'USD'
                }).format(amount);
            }

            capitalizeFirst(str) {
                return str.charAt(0).toUpperCase() + str.slice(1);
            }
        }

        // Initialize when page loads
        document.addEventListener('DOMContentLoaded', async function() {
            // Initialize page header first
            await initializePageHeader();
            
            // Then initialize credit card transactions
            window.creditCardTransactions = new CreditCardTransactions();
        });

        // Logout function for consistency
        function logout() {
            if (confirm('Are you sure you want to logout?')) {
                sessionStorage.removeItem('currentUser');
                sessionStorage.removeItem('loginTime');
                sessionStorage.removeItem('storageType');
                sessionStorage.removeItem('dataSource');
                window.location.href = 'index.html';
            }
        }
    </script>
</body>
</html>
