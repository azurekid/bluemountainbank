<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Credit Card Transactions - Blue Mountain Bank</title>
    <!-- User authentication check script -->
    <script>
        // Immediately check if user is logged in
        (function() {
            const currentUser = sessionStorage.getItem('currentUser');
            if (!currentUser) {
                window.location.replace('login.html?redirect=' + encodeURIComponent(window.location.pathname));
                return;
            }
        })();
    </script>
    <!-- CDN Helper Script -->
    <script src="js/cdn-helper.js"></script>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/user-dashboard.css">
    <link rel="stylesheet" href="css/dark-mode.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .credit-cards-page {
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 0;
            transition: all 0.3s ease;
        }

        .dark-mode .credit-cards-page {
            background: linear-gradient(135deg, rgba(44, 62, 80, 0.9) 0%, rgba(52, 73, 94, 0.9) 100%);
        }

        .credit-cards-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .page-header {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.3s ease;
        }

        .dark-mode .page-header {
            background: rgba(44, 62, 80, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #e0e0e0;
        }

        .page-title {
            color: #2c3e50;
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 10px;
            transition: color 0.3s ease;
        }

        .dark-mode .page-title {
            color: #e0e0e0;
        }

        .page-subtitle {
            color: #7f8c8d;
            font-size: 1.1rem;
            margin-bottom: 20px;
            transition: color 0.3s ease;
        }

        .dark-mode .page-subtitle {
            color: #bdc3c7;
        }

        .back-button {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: linear-gradient(135deg, #3498db, #2980b9);
            color: white;
            padding: 12px 24px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(52, 152, 219, 0.3);
            border: none;
            cursor: pointer;
        }

        .back-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(52, 152, 219, 0.4);
        }

        .credit-card-section {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.3s ease;
        }

        .dark-mode .credit-card-section {
            background: rgba(44, 62, 80, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #e0e0e0;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid rgba(236, 240, 241, 0.5);
        }

        .dark-mode .card-header {
            border-bottom: 2px solid rgba(255, 255, 255, 0.1);
        }

        .card-title {
            font-size: 1.5rem;
            font-weight: 600;
            color: #2c3e50;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: color 0.3s ease;
        }

        .dark-mode .card-title {
            color: #e0e0e0;
        }

        .card-balance {
            font-size: 1.2rem;
            font-weight: 700;
            color: #e74c3c;
        }

        .card-balance.positive {
            color: #27ae60;
        }

        .transactions-filters {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .filter-select, .filter-input {
            padding: 10px 15px;
            border: 1px solid rgba(189, 195, 199, 0.5);
            border-radius: 8px;
            font-size: 14px;
            background: rgba(255, 255, 255, 0.9);
            transition: all 0.3s ease;
        }

        .dark-mode .filter-select,
        .dark-mode .filter-input {
            background: rgba(52, 73, 94, 0.9);
            color: #e0e0e0;
            border-color: rgba(255, 255, 255, 0.2);
        }

        .transactions-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 8px;
            overflow: hidden;
        }

        .dark-mode .transactions-table {
            background: rgba(52, 73, 94, 0.5);
        }

        .transactions-table th {
            background: rgba(248, 249, 250, 0.9);
            padding: 15px;
            text-align: left;
            font-weight: 600;
            color: #2c3e50;
            border-bottom: 2px solid rgba(236, 240, 241, 0.5);
        }

        .dark-mode .transactions-table th {
            background: rgba(44, 62, 80, 0.9);
            color: #e0e0e0;
            border-bottom-color: rgba(255, 255, 255, 0.1);
        }

        .transactions-table td {
            padding: 15px;
            border-bottom: 1px solid rgba(236, 240, 241, 0.3);
            transition: background 0.3s ease;
        }

        .dark-mode .transactions-table td {
            border-bottom-color: rgba(255, 255, 255, 0.1);
        }

        .transactions-table tr:hover td {
            background: rgba(52, 152, 219, 0.1);
        }

        .transaction-amount {
            font-weight: 600;
        }

        .transaction-amount.positive {
            color: #27ae60;
        }

        .transaction-amount.negative {
            color: #e74c3c;
        }

        .transaction-category {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 500;
            text-transform: uppercase;
        }

        .category-purchase { background: #3498db; color: white; }
        .category-payment { background: #27ae60; color: white; }
        .category-restaurants { background: #e67e22; color: white; }
        .category-gas { background: #9b59b6; color: white; }
        .category-groceries { background: #f39c12; color: white; }
        .category-shopping { background: #e74c3c; color: white; }
        .category-hotels { background: #1abc9c; color: white; }
        .category-airlines { background: #34495e; color: white; }
        .category-entertainment { background: #8e44ad; color: white; }

        .no-transactions {
            text-align: center;
            color: #7f8c8d;
            font-style: italic;
            padding: 40px;
        }

        .dark-mode .no-transactions {
            color: #bdc3c7;
        }

        @media (max-width: 768px) {
            .credit-cards-container {
                padding: 10px;
            }

            .page-title {
                font-size: 2rem;
            }

            .transactions-filters {
                flex-direction: column;
            }

            .transactions-table {
                font-size: 14px;
            }

            .transactions-table th,
            .transactions-table td {
                padding: 10px 5px;
            }
        }
    </style>
</head>
<body>
    <div class="credit-cards-page">
        <div class="credit-cards-container">
            <div class="page-header">
                <h1 class="page-title">
                    <i class="fas fa-credit-card"></i>
                    Credit Card Transactions
                </h1>
                <p class="page-subtitle">View and manage your credit card transaction history</p>
                <a href="user-dashboard.html" class="back-button">
                    <i class="fas fa-arrow-left"></i>
                    Back to Dashboard
                </a>
            </div>

            <div id="creditCardsContainer">
                <!-- Credit card sections will be dynamically loaded here -->
            </div>
        </div>
    </div>

    <script src="js/local-storage-manager.js?v=2.0"></script>
    <script src="js/azure-storage-manager.js?v=2.0"></script>
    <script src="js/storage-factory.js?v=2.0"></script>
    <script>
        class CreditCardTransactions {
            constructor() {
                this.currentUser = null;
                this.storageManager = null;
                this.init();
            }

            async init() {
                const currentUserId = sessionStorage.getItem('currentUser');
                if (!currentUserId) {
                    window.location.href = 'login.html';
                    return;
                }

                try {
                    const storageFactory = new StorageFactory();
                    this.storageManager = await storageFactory.getStorageManager();
                    
                    this.currentUser = await this.storageManager.getUserData(currentUserId);
                    
                    if (!this.currentUser) {
                        alert('User data not found. Redirecting to login.');
                        window.location.href = 'login.html';
                        return;
                    }

                    this.loadCreditCards();
                    this.applyUserTheme();
                } catch (error) {
                    console.error('Error initializing credit card transactions:', error);
                    alert('Failed to load credit card data. Please try again.');
                }
            }

            applyUserTheme() {
                // Check user preferences for theme
                const preferences = this.currentUser.preferences || {};
                const theme = preferences.theme || 'light';
                const darkMode = preferences.darkMode || false;

                // Apply dark mode if enabled
                if (theme === 'dark' || darkMode) {
                    document.body.classList.add('dark-mode');
                    document.body.setAttribute('data-theme', 'dark');
                } else {
                    document.body.classList.remove('dark-mode');
                    document.body.setAttribute('data-theme', 'light');
                }
            }

            loadCreditCards() {
                const container = document.getElementById('creditCardsContainer');
                container.innerHTML = '';

                const creditCards = this.currentUser.personalInfo?.creditCards || {};
                
                if (Object.keys(creditCards).length === 0) {
                    container.innerHTML = '<div class="no-transactions">No credit cards found</div>';
                    return;
                }

                Object.entries(creditCards).forEach(([cardId, cardData]) => {
                    const cardSection = this.createCreditCardSection(cardId, cardData);
                    container.appendChild(cardSection);
                });
            }

            createCreditCardSection(cardId, cardData) {
                const section = document.createElement('div');
                section.className = 'credit-card-section';
                
                const maskedNumber = this.maskCreditCard(cardData.number);
                const balance = cardData.balance || 0;
                const transactions = cardData.transactions || [];
                
                section.innerHTML = `
                    <div class="card-header">
                        <div class="card-title">
                            <i class="fas fa-credit-card"></i>
                            ${cardData.name} (${maskedNumber})
                        </div>
                        <div class="card-balance ${balance >= 0 ? 'positive' : 'negative'}">
                            Balance: ${this.formatCurrency(balance)}
                        </div>
                    </div>
                    
                    <div class="transactions-filters">
                        <select class="filter-select" id="categoryFilter_${cardId}">
                            <option value="">All Categories</option>
                            <option value="purchase">Purchases</option>
                            <option value="payment">Payments</option>
                            <option value="restaurants">Restaurants</option>
                            <option value="gas">Gas</option>
                            <option value="groceries">Groceries</option>
                            <option value="shopping">Shopping</option>
                            <option value="hotels">Hotels</option>
                            <option value="airlines">Airlines</option>
                            <option value="entertainment">Entertainment</option>
                        </select>
                        
                        <input type="date" class="filter-input" id="dateFilter_${cardId}" 
                               placeholder="Filter by date">
                        
                        <button class="back-button" onclick="creditCardTransactions.filterTransactions('${cardId}')">
                            <i class="fas fa-filter"></i>
                            Filter
                        </button>
                    </div>
                    
                    <div class="transactions-container" id="transactionsContainer_${cardId}">
                        ${this.createTransactionsTable(transactions)}
                    </div>
                `;
                
                return section;
            }

            createTransactionsTable(transactions) {
                if (transactions.length === 0) {
                    return '<div class="no-transactions">No transactions found</div>';
                }

                // Sort transactions by date (newest first)
                const sortedTransactions = [...transactions].sort((a, b) => 
                    new Date(b.date) - new Date(a.date)
                );

                let tableHTML = `
                    <table class="transactions-table">
                        <thead>
                            <tr>
                                <th>Date</th>
                                <th>Description</th>
                                <th>Category</th>
                                <th>Amount</th>
                                <th>Type</th>
                            </tr>
                        </thead>
                        <tbody>
                `;

                sortedTransactions.forEach(transaction => {
                    const date = new Date(transaction.date).toLocaleDateString('en-US', {
                        year: 'numeric',
                        month: 'short',
                        day: 'numeric'
                    });
                    
                    const amount = transaction.amount;
                    const amountClass = amount >= 0 ? 'positive' : 'negative';
                    const amountText = `${amount >= 0 ? '+' : ''}${this.formatCurrency(amount)}`;
                    const transactionIcon = this.getTransactionIcon(transaction.category, transaction.type);
                    
                    tableHTML += `
                        <tr>
                            <td>${date}</td>
                            <td>
                                <div style="display: flex; align-items: center; gap: 10px;">
                                    <i class="${transactionIcon}" style="color: #3498db; font-size: 16px;"></i>
                                    ${transaction.description}
                                </div>
                            </td>
                            <td>
                                <span class="transaction-category category-${transaction.category}">
                                    ${transaction.category}
                                </span>
                            </td>
                            <td class="transaction-amount ${amountClass}">${amountText}</td>
                            <td>${this.capitalizeFirst(transaction.type)}</td>
                        </tr>
                    `;
                });

                tableHTML += `
                        </tbody>
                    </table>
                `;

                return tableHTML;
            }

            getTransactionIcon(category, type) {
                // Payment transactions get a special icon
                if (type === 'payment') {
                    return 'fas fa-check-circle';
                }

                // Category-specific icons
                const categoryIcons = {
                    'restaurants': 'fas fa-utensils',
                    'gas': 'fas fa-gas-pump',
                    'groceries': 'fas fa-shopping-cart',
                    'shopping': 'fas fa-shopping-bag',
                    'hotels': 'fas fa-bed',
                    'airlines': 'fas fa-plane',
                    'entertainment': 'fas fa-tv',
                    'utilities': 'fas fa-bolt',
                    'purchase': 'fas fa-credit-card',
                    'payment': 'fas fa-check-circle'
                };

                return categoryIcons[category.toLowerCase()] || 'fas fa-circle';
            }

            filterTransactions(cardId) {
                const categoryFilter = document.getElementById(`categoryFilter_${cardId}`).value;
                const dateFilter = document.getElementById(`dateFilter_${cardId}`).value;
                
                const cardData = this.currentUser.personalInfo.creditCards[cardId];
                let filteredTransactions = [...(cardData.transactions || [])];

                // Apply category filter
                if (categoryFilter) {
                    filteredTransactions = filteredTransactions.filter(t => 
                        t.category === categoryFilter
                    );
                }

                // Apply date filter
                if (dateFilter) {
                    filteredTransactions = filteredTransactions.filter(t => 
                        t.date === dateFilter
                    );
                }

                const container = document.getElementById(`transactionsContainer_${cardId}`);
                container.innerHTML = this.createTransactionsTable(filteredTransactions);
            }

            maskCreditCard(cardNumber) {
                if (!cardNumber) return '**** **** **** ****';
                const clean = cardNumber.replace(/\D/g, '');
                if (clean.length >= 13) {
                    const lastFour = clean.substring(clean.length - 4);
                    return `**** **** **** ${lastFour}`;
                }
                return '**** **** **** ****';
            }

            formatCurrency(amount) {
                return new Intl.NumberFormat('en-US', {
                    style: 'currency',
                    currency: 'USD'
                }).format(Math.abs(amount));
            }

            capitalizeFirst(str) {
                return str.charAt(0).toUpperCase() + str.slice(1);
            }
        }

        // Initialize when page loads
        document.addEventListener('DOMContentLoaded', function() {
            window.creditCardTransactions = new CreditCardTransactions();
        });
    </script>
</body>
</html>
